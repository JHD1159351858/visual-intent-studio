             ============================================================ */
          function mulberry32(a) {
            return function () {
              a |= 0;
              a = (a + 0x6d2b79f5) | 0;
              var t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };

            var cv = document.getElementById(id);

            var c = cv.getContext("2d");

            c.clearRect(0, 0, 1920, 1080);
            c.fillStyle = "#000000";
            c.fillRect(0, 0, 1920, 1080);

            var g = c.createRadialGradient(960, 500, 0, 960, 500, 880);

            g.addColorStop(0.45, "rgba(70,82,120,0.035)");
            g.addColorStop(1, "rgba(0,0,0,0)");
            c.fillStyle = g;
            c.fillRect(0, 0, 1920, 1080);

            var gp = c.createRadialGradient(280, 940, 0, 280, 940, 760);
            gp.addColorStop(0, "rgba(254,144,232,0.05)");
            gp.addColorStop(1, "rgba(0,0,0,0)");
            c.fillStyle = gp;
            c.fillRect(0, 0, 1920, 1080);

            var gi = c.createRadialGradient(1660, 180, 0, 1660, 180, 700);
            gi.addColorStop(0, "rgba(192,247,254,0.045)");
            gi.addColorStop(1, "rgba(0,0,0,0)");
            c.fillStyle = gi;
            c.fillRect(0, 0, 1920, 1080);

            /* faint flow-field strokes */
            c.save();
            c.globalCompositeOperation = "screen";
            c.filter = "blur(10px)";
            for (var i = 0; i < 26; i++) {
              var x0 = R() * 1920;
              var y0 = R() * 1080;
              var c1x = x0 + (R() - 0.5) * 520;
              var c1y = y0 + (R() - 0.5) * 360;
              var c2x = x0 + (R() - 0.5) * 760;
              var c2y = y0 + (R() - 0.5) * 520;
              var x1 = x0 + (R() - 0.5) * 980;
              var y1 = y0 + (R() - 0.5) * 640;
              c.beginPath();
              c.moveTo(x0, y0);
              c.bezierCurveTo(c1x, c1y, c2x, c2y, x1, y1);
              c.strokeStyle =
                i % 5 === 0
                  ? "rgba(254,144,232,0.05)"
                  : i % 7 === 0
                    ? "rgba(192,247,254,0.05)"
                    : "rgba(200,215,245,0.04)";
              c.lineWidth = 1.2 + R() * 2.2;
              c.stroke();

            /* starfield */
            for (var s = 0; s < 300; s++) {
              var sx = R() * 1920;
              var sy = R() * 1080;
              var sr = 0.35 + R() * 1.5;
              var sa = 0.1 + R() * 0.5;
              var pick = R();
              c.beginPath();
              c.arc(sx, sy, sr, 0, Math.PI * 2);
              c.fillStyle =
                pick < 0.07

                  : pick < 0.2
                    ? "rgba(192,247,254," + sa + ")"
                    : "rgba(232,238,250," + sa + ")";
              c.fill();

              var by = R() * 1080;
              var br = 1.4 + R() * 1.2;
              var ba = 0.5 + R() * 0.35;
              var gr = c.createRadialGradient(bx, by, 0, bx, by, br * 9);

              gr.addColorStop(0.25, "rgba(220,235,255," + ba * 0.35 + ")");
              gr.addColorStop(1, "rgba(0,0,0,0)");
              c.fillStyle = gr;
              c.beginPath();
              c.arc(bx, by, br * 9, 0, Math.PI * 2);
