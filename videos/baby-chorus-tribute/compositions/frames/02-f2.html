          tl.set(".chromefill", { opacity: 1 }, 0);
          tl.set(".plate", { opacity: 0 }, 0);
          tl.set(".rgb", { xPercent: -50, yPercent: -50, opacity: 0 }, 0);

          tl.set("#f2_g1_w1", { x: 0, y: -55 }, 0);
          tl.set("#f2_g1_w2", { x: 1960, y: 355 }, 0);
          tl.set("#f2_g1_w3", { x: -440, y: 1120 }, 0);
          tl.set("#f2_g1_w1 .word", { scale: 1.55, opacity: 0 }, 0);
          tl.set("#f2_g1_w2 .word", { scale: 1.4 }, 0);
          tl.set("#f2_g1_w3 .word", { scale: 1.32 }, 0);

          tl.set("#f2_g2_stack", { x: 0, y: 0, scale: 1, opacity: 1, filter: "none" }, 0);
          tl.set("#f2_g2_ohwrap", { opacity: 0 }, 0);
          tl.set(".ohword", { scale: 2.15 }, 0);
          tl.set("#f2_g2_rays", { opacity: 0 }, 0);

          /* ---------- 180 shards: seeded heart-shaped detonation ---------- */
          const SHARDS = 180;
          const shardHost = document.getElementById("f2_g1_shards");
          for (let i = 0; i < SHARDS; i++) {
            const a = (i / SHARDS) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(a), 3);
            const hy = -(
              13 * Math.cos(a) -
              5 * Math.cos(2 * a) -
              2 * Math.cos(3 * a) -
              Math.cos(4 * a)
            );
            const inner = 0.34 + (((i * 37) % 100) / 100) * 0.66;
            const sx = hx * 14 * inner + (((i * 73) % 21) - 10) * 1.7;
            const sy = hy * 14 * inner + (((i * 41) % 19) - 9) * 1.7;
            const ang = Math.atan2(sy, sx) + (((i * 53) % 13) - 6) * 0.05;
            const dist = 860 + (i % 8) * 205 + ((i * 29) % 7) * 32;
            const ex = sx + Math.cos(ang) * dist;
            const ey = sy + Math.sin(ang) * dist;
            const rot = (i % 2 === 0 ? 1 : -1) * (110 + (i % 7) * 95);

            const el = document.createElement("div");
            const bucket = i % 20;
            const kind = bucket < 11 ? "kchrome" : bucket < 16 ? "kpink" : "kice";
            el.className = "shard " + kind + " sh" + (i % 3);
            el.style.width = 10 + (i % 6) * 5 + (i % 23 === 0 ? 26 : 0) + "px";
            el.style.height = 6 + (i % 4) * 4 + "px";
            el.style.zIndex = String(1 + (i % 4));
            shardHost.appendChild(el);

            tl.set(
              el,
              {
                xPercent: -50,
                yPercent: -50,
                x: sx,
                y: sy,
                rotation: 0,
                scale: 0.65 + (i % 4) * 0.2,
              },
              0,
            );
            tl.to(el, { x: ex, y: ey, rotation: rot, duration: 4.63, ease: "none" }, 0);
          }

          /* ---------- radial burst under the first stamp ---------- */
          const BURST = 22;
          const burstHost = document.getElementById("f2_g1_burst");
          for (let i = 0; i < BURST; i++) {
            const el = document.createElement("div");
            el.className = "bline";
            el.style.height = 720 + (i % 5) * 110 + "px";
            el.style.opacity = String(0.9 - (i % 3) * 0.2);
            burstHost.appendChild(el);
            tl.set(el, { xPercent: -50, yPercent: -50, rotation: i * (180 / BURST), scaleY: 0 }, 0);
            tl.to(el, { scaleY: 1, duration: 0.24, ease: "power4.out" }, 0.01 + (i % 4) * 0.012);
            tl.to(el, { opacity: 0, duration: 0.4, ease: "power2.in" }, 0.3 + (i % 4) * 0.015);
          }

          /* ---------- drop flash + hero stamp ---------- */
          tl.to("#f2_g1_flash", { opacity: 0, duration: 0.16, ease: "power3.in" }, 0.03);
          tl.to("#f2_g1_w1 .word", { scale: 1, opacity: 1, duration: 0.14, ease: "power4.out" }, 0.02);
          tl.to("#f2_g1_w1 .word", { scale: 1.02, duration: 0.08, ease: "power2.out" }, 0.16);
          tl.to("#f2_g1_w1 .word", { scale: 1, duration: 0.24, ease: "power2.out" }, 0.24);
          tl.to("#f2_g1_glow", { opacity: 0, duration: 1.1, ease: "power2.out" }, 0.3);

          /* ---------- chrome sweeps ---------- */
          function sweep(sel, t, dur) {
            tl.fromTo(
              sel,
              { backgroundPosition: "190% 0" },
              { backgroundPosition: "-80% 0", duration: dur, ease: "power2.inOut" },
              t,

          }
          sweep("#f2_g1_w1 .chromefill, #f2_g1_w2 .chromefill, #f2_g1_w3 .chromefill", 0.03, 1.25);
          sweep("#f2_g1_w1 .chromefill, #f2_g1_w2 .chromefill, #f2_g1_w3 .chromefill", 2.31, 1.1);

          /* ---------- 0 ms fill swaps: chrome / pink / ice ---------- */
          const fillSwaps = [
            [0.418, "pink"],
            [1.385, "ice"],
            [1.846, "chrome"],
            [2.77, "pink"],
            [3.231, "ice"],
            [3.693, "chrome"],
            [4.154, "pink"],
          ];
          const stampIds = ["#f2_g1_w1", "#f2_g1_w2", "#f2_g1_w3"];
          fillSwaps.forEach(function (s) {
            const t = s[0];
            const kind = s[1];
            stampIds.forEach(function (id) {
              tl.set(id + " .chromefill", { opacity: kind === "chrome" ? 1 : 0 }, t);
              tl.set(id + " .plate.pink", { opacity: kind === "pink" ? 1 : 0 }, t);
              tl.set(id + " .plate.ice", { opacity: kind === "ice" ? 1 : 0 }, t);
            });

          /* ---------- stamps 2 and 3 ---------- */
          tl.to("#f2_g1_w2", { x: 440, duration: 0.2, ease: "power4.out" }, 0.906);
          tl.to("#f2_g1_w2 .word", { scale: 1, duration: 0.2, ease: "power4.out" }, 0.906);
          tl.set("#f2_g1_flash", { opacity: 0.5 }, 0.906);
          tl.set("#f2_g1_flash", { opacity: 0 }, 0.972);

          function shakeAt(target, t, amp, flip, steps) {

            tl.set(target, { x: -amp * 0.72, y: amp * 0.5 * flip }, t + 0.033);

          shakeAt("#f2_g1_cam", 1.092, 2.4, -1, 3);
          shakeAt("#f2_g1_cam", 1.556, 4.0, 1, 4);
          shakeAt("#f2_g1_cam", 1.788, 2.6, -1, 3);
