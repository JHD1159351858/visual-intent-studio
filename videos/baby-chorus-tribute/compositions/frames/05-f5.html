      <script>
        (function () {
          const P2R = Math.PI * 2;
          const DEG = 180 / Math.PI;
          const tl = gsap.timeline({ paused: true });

          /* ---------------- group visibility (0ms cuts) ---------------- */
          tl.set("#f5_g1", { autoAlpha: 1 }, 0);
          tl.set("#f5_g2", { autoAlpha: 0 }, 0);
          tl.set("#f5_g1", { autoAlpha: 0 }, 4.064);
          tl.set("#f5_g2", { autoAlpha: 1 }, 4.064);

          tl.set("#f5_g1_flash", { opacity: 0 }, 0);
          tl.set("#f5_g2_flash", { opacity: 0 }, 0);

          /* ================================================================
             GROUP 1 — local 0 – 4.064  (track 30.209 – 34.273)
             sun bloom → godrays → chrome heart → BABY slam → per-kick bursts
             ================================================================ */

          // white flash masking the cut into the bloom (authored at .88 in CSS so t=0 is white)
          tl.to("#f5_g1_flash", { opacity: 0, duration: 0.09, ease: "power2.in" }, 0.02);

          // cream-to-pink sun blooms
          tl.fromTo(
            "#f5_g1_sunInner",
            { opacity: 0, scale: 0.35 },
            { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" },
            0,
          );

          // volumetric godrays: fade in, slow rotation across the whole group
          tl.fromTo(
            "#f5_g1_raysPulse",
            { opacity: 0 },
            { opacity: 0.85, duration: 0.9, ease: "power2.out" },
            0.05,
          );
          tl.fromTo("#f5_g1_raysRot", { rotation: 0 }, { rotation: 24, duration: 4.064, ease: "none" }, 0);

          // giant chrome heart blooms out of the sun, drifts slowly
          tl.fromTo(
            "#f5_g1_heartWrap",
            { opacity: 0, scale: 0.62 },
            { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.5)" },
            0.02,
          );
          tl.fromTo("#f5_g1_heartWrap", { rotation: -2 }, { rotation: 2.2, duration: 4.064, ease: "sine.inOut" }, 0.02);

          // camera pull-back 1.1x → 0.95x
          tl.fromTo("#f5_g1_camera", { scale: 1.1 }, { scale: 0.95, duration: 3.9, ease: "power1.inOut" }, 0.1);

          // BABY lands at local 1.811 (track 32.020) — 560px chrome
          tl.set("#f5_g1_wordWrap", { opacity: 0 }, 0);
          tl.fromTo(
            "#f5_g1_wordWrap",
            { xPercent: -50, yPercent: -50, opacity: 0, scale: 2.1 },
            { xPercent: -50, yPercent: -50, opacity: 1, scale: 1, duration: 0.17, ease: "power4.out" },
            1.811,
          );
          tl.fromTo(
            "#f5_g1_wordWrap",
            { y: 0 },
            { y: -10, duration: 2.2, ease: "sine.inOut" },
            1.99,
          );
          // short flash on the landing
          tl.fromTo("#f5_g1_flash", { opacity: 0 }, { opacity: 0.4, duration: 0.02, ease: "none" }, 1.811);
          tl.to("#f5_g1_flash", { opacity: 0, duration: 0.1, ease: "power2.out" }, 1.835);

          // chrome glint sweeps on the word (chrome-sweep)
          [1.87, 2.83, 3.75].forEach(function (t) {
            tl.fromTo(
              ".g1_word",
              { backgroundPosition: "210% 0" },
              { backgroundPosition: "-70% 0", duration: 0.8, ease: "power2.inOut" },
              t,
            );
          });

          // kick pulses: rays + sun breathe on every kick
          const KICKS = [0, 0.883, 1.811, 2.77, 3.693];
          KICKS.forEach(function (k, j) {
            tl.fromTo(
              "#f5_g1_raysPulse",
              { scale: 1 },
              { scale: 1.055, duration: 0.1, ease: "power2.out" },
              k,
            );
            tl.to("#f5_g1_raysPulse", { scale: 1, duration: 0.32, ease: "power2.inOut" }, k + 0.1);

            if (j > 0) {
              tl.fromTo(
                "#f5_g1_sunWrap",
                { scale: 1 },
                { scale: 1.03, duration: 0.12, ease: "power2.out" },
                k,
              );
              tl.to("#f5_g1_sunWrap", { scale: 1, duration: 0.4, ease: "power2.inOut" }, k + 0.12);
              // palette swap: the sun flares pink on alternating kicks
              tl.set("#f5_g1_sunHot", { opacity: j % 2 === 1 ? 0.55 : 0 }, k);
            }
          });

          // chrome / white particle bursts from the wordmark, per kick
          const G1C = ["#FFFFFF", "#E9ECF6", "#C0F7FE", "#FE90E8", "#FFFFFF", "#FFFDF5", "#D5D9E8"];
          const g1pHost = document.getElementById("f5_g1_particles");
          KICKS.forEach(function (k, j) {
            const N = 22;
            for (let i = 0; i < N; i++) {
              const el = document.createElement("div");
              el.className = "g1_p";
              const sz = 5 + (i % 5) * 3;
              const col = G1C[(i + j * 3) % G1C.length];
              el.style.width = sz + "px";
              el.style.height = sz + "px";
              el.style.left = -sz / 2 + "px";
              el.style.top = -sz / 2 + "px";
              el.style.background = col;
              el.style.boxShadow = "0 0 10px " + col;
              g1pHost.appendChild(el);

              const ang = (i / N) * P2R + j * 0.617 + (i % 3) * 0.13;
              const rad = 240 + (i % 6) * 90 + (i % 4) * 35;
              const tx = Math.cos(ang) * rad * 1.55;
              const ty = Math.sin(ang) * rad * 0.85;

              tl.set(el, { opacity: 0 }, 0);
              tl.fromTo(
                el,
                { x: 0, y: 0, scale: 1, opacity: 1 },
                {
                  x: tx,
                  y: ty,
                  scale: 0,
                  opacity: 0,
                  duration: 0.5 + (i % 5) * 0.08,
                  ease: "expo.out",
                },
                k + 0.02 + (i % 3) * 0.012,
              );
            }
          });

          // radial burst lines on the wordmark landing (radial-burst-lines)
          const g1lHost = document.getElementById("f5_g1_lines");
          for (let i = 0; i < 18; i++) {
            const el = document.createElement("div");
            el.className = "g1_line";
            const a = (i / 18) * P2R + 0.17;
            const r0 = 520 + (i % 3) * 22;
            const len = 160 + (i % 4) * 55;
            const w = i % 4 === 0 ? 6 : 3;
            const col = i % 4 === 0 ? "#C0F7FE" : "#FFFFFF";
            el.style.width = w + "px";
            el.style.height = len + "px";
            el.style.left = 960 + Math.cos(a) * r0 - w / 2 + "px";
            el.style.top = 486 + Math.sin(a) * r0 + "px";
            el.style.background = "linear-gradient(to bottom, " + col + " 0%, rgba(255,255,255,0) 100%)";
            g1lHost.appendChild(el);

            tl.set(el, { rotation: a * DEG - 90, transformOrigin: "50% 0%", scaleY: 0, opacity: 0 }, 0);
            tl.fromTo(
              el,
              { scaleY: 0, opacity: 0 },
              { scaleY: 1, opacity: 0.95, duration: 0.16, ease: "power4.out" },
              1.811 + (i % 4) * 0.009,
            );
            tl.to(el, { opacity: 0, duration: 0.38, ease: "power2.out" }, 1.99 + (i % 4) * 0.012);
          }

          /* ================================================================
             GROUP 2 — local 4.064 – 7.245  (track 34.273 – 37.454)
             ring of 12 BABY copies → beat-step orbit → converge → OH → white
             ================================================================ */

          const RING_R = 500;
          const reps = [];
          const ring = document.getElementById("f5_g2_ring");
          for (let i = 0; i < 8; i++) {
            const slot = document.createElement("div");
            slot.className = "g2_slot";
            const rep = document.createElement("div");
            rep.className = "g2_rep";
            rep.textContent = "BABY";
            const a = (i / 8) * P2R - Math.PI / 2;
            slot.style.left = Math.cos(a) * RING_R + "px";
            slot.style.top = Math.sin(a) * RING_R + "px";
            ring.appendChild(slot);
            slot.appendChild(rep);

            // bottom edge faces the ring center
            tl.set(rep, { xPercent: -50, yPercent: -50, rotation: a * DEG + 90, opacity: 0 }, 0);
            // staggered reveal as the camera pulls back
            tl.fromTo(
              rep,
              { opacity: 0, scale: 0.45 },
              { opacity: 0.94, scale: 1, duration: 0.3, ease: "power3.out" },
              4.064 + i * 0.03,
            );
            reps.push({ el: rep, a: a });
          }

          // camera pull-back reveal (dolly-zoom)
          tl.fromTo("#f5_g2_stage", { scale: 1.18 }, { scale: 1, duration: 0.45, ease: "power3.out" }, 4.064);
          tl.fromTo("#f5_g2_stage", { scale: 1 }, { scale: 1.025, duration: 1.42, ease: "sine.inOut", immediateRender: false }, 4.52);

          // central chrome heart anchors the ring so it never reads as a spinner
          tl.fromTo(
            "#f5_g2_core",
            { opacity: 0, scale: 0.82 },
            { opacity: 0.55, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
            4.064,
          );
          tl.to("#f5_g2_core", { rotation: 7, duration: 2.45, ease: "sine.inOut" }, 4.064);
          tl.to("#f5_g2_core", { opacity: 0, scale: 0.84, duration: 0.34, ease: "power2.in" }, 6.02);

          // chrome sweep across all replicas
          tl.fromTo(
            ".g2_rep",
            { backgroundPosition: "210% 0" },
            { backgroundPosition: "-70% 0", duration: 0.9, ease: "power2.inOut", stagger: 0.015 },
            4.12,
          );

          // one orbit step per beat (45° = one slot)
          [4.616, 5.077, 5.539, 6.001].forEach(function (t, i) {
            tl.to("#f5_g2_ring", { rotation: (i + 1) * 45, duration: 0.09, ease: "power3.out" }, t);
          });

          // converge into the center, ending at 6.462
          reps.forEach(function (r, i) {
            const dx = -Math.cos(r.a) * RING_R;
            const dy = -Math.sin(r.a) * RING_R;
            tl.to(
              r.el,
              { x: dx, y: dy, scale: 0.12, opacity: 0, duration: 0.4, ease: "power3.in" },
              6.001 + (i % 4) * 0.012,
            );
          });

          // OH stamps at local 6.462 (track 36.671) — cream + yellow, 700px
          tl.set("#f5_g2_oh", { xPercent: -50, yPercent: -50, opacity: 0 }, 0);
          tl.fromTo(
            "#f5_g2_oh",
            { opacity: 0, scale: 2.35 },
            { opacity: 1, scale: 1, duration: 0.13, ease: "power4.out" },
            6.449,
          );
          tl.set("#f5_g2_oh", { opacity: 1 }, 6.462);
          tl.to("#f5_g2_oh", { scale: 1.01, duration: 0.08, ease: "power1.out" }, 6.585);
          tl.to("#f5_g2_oh", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 6.67);

          // stamp flash + camera shake
          tl.fromTo("#f5_g2_flash", { opacity: 0 }, { opacity: 0.35, duration: 0.03, ease: "none" }, 6.455);
          tl.to("#f5_g2_flash", { opacity: 0, duration: 0.12, ease: "power2.out" }, 6.49);

          tl.to("#f5_g2_stage", { x: 9, duration: 0.04, ease: "none" }, 6.462);
          tl.to("#f5_g2_stage", { x: -7, duration: 0.05, ease: "none" }, 6.502);
          tl.to("#f5_g2_stage", { x: 4, duration: 0.05, ease: "none" }, 6.552);
          tl.to("#f5_g2_stage", { x: 0, duration: 0.07, ease: "none" }, 6.602);

          // radial burst around OH
          const g2lHost = document.getElementById("f5_g2_bursts");
          for (let i = 0; i < 24; i++) {
            const el = document.createElement("div");
            el.className = "g2_line";
            const a = (i / 24) * P2R + 0.09;
            const r0 = 320 + (i % 3) * 26;
            const len = 200 + (i % 5) * 70;
            const w = i % 3 === 0 ? 6 : 3;
            const col = i % 2 === 0 ? "#FFFDF5" : "#F7CB46";
            el.style.width = w + "px";
            el.style.height = len + "px";
            el.style.left = 960 + Math.cos(a) * r0 - w / 2 + "px";
            el.style.top = 540 + Math.sin(a) * r0 + "px";
            el.style.background = "linear-gradient(to bottom, " + col + " 0%, rgba(255,253,245,0) 100%)";
            g2lHost.appendChild(el);

            tl.set(el, { rotation: a * DEG - 90, transformOrigin: "50% 0%", scaleY: 0, opacity: 0 }, 0);
            tl.fromTo(
              el,
              { scaleY: 0, opacity: 0 },
              { scaleY: 1, opacity: 1, duration: 0.18, ease: "power4.out" },
              6.462 + (i % 4) * 0.008,
            );
            tl.to(el, { opacity: 0, duration: 0.4, ease: "power2.out" }, 6.66 + (i % 4) * 0.01);
          }

          // cream / yellow particle burst at the stamp
          const G2C = ["#FFFDF5", "#F7CB46", "#FFFFFF", "#FE90E8"];
          const g2pHost = document.getElementById("f5_g2_particles");
          for (let i = 0; i < 26; i++) {
            const el = document.createElement("div");
            el.className = "g2_p";
            const sz = 6 + (i % 5) * 4;
            const col = G2C[i % G2C.length];
            el.style.width = sz + "px";
            el.style.height = sz + "px";
            el.style.left = -sz / 2 + "px";
            el.style.top = -sz / 2 + "px";
            el.style.background = col;
            el.style.boxShadow = "0 0 12px " + col;
            g2pHost.appendChild(el);

            const ang = (i / 26) * P2R + 0.21;
            const rad = 320 + (i % 6) * 110;
            const tx = Math.cos(ang) * rad * 1.4;
            const ty = Math.sin(ang) * rad * 0.9;

            tl.set(el, { opacity: 0 }, 0);
            tl.fromTo(
              el,
              { x: 0, y: 0, scale: 1, opacity: 1 },
              {
                x: tx,
                y: ty,
                scale: 0,
                opacity: 0,
                duration: 0.5 + (i % 4) * 0.07,
                ease: "expo.out",
              },
              6.462 + (i % 3) * 0.008,
            );
          }

          // final white flash freezes the word (track 37.133), hold to the cut
          tl.to("#f5_g2_flash", { opacity: 0.95, duration: 0.04, ease: "power4.in" }, 6.924);
          tl.to("#f5_g2_flash", { opacity: 0.55, duration: 0.12, ease: "power2.out" }, 6.98);
          tl.set("#f5_g2_flash", { opacity: 0.55 }, 7.245);

          window.__timelines = window.__timelines || {};
          window.__timelines["05-f5"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
