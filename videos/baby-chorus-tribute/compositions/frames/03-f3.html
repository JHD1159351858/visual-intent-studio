      <script>
        (() => {
          const DUR = 7.384;
          const SVGNS = "http://www.w3.org/2000/svg";
          const tl = gsap.timeline({ paused: true });

          function shakeGroup(sel, t, amp) {
            tl.fromTo(sel, { x: 0, y: 0 }, { x: amp, y: -amp * 0.6, duration: 0.05, ease: "none" }, t);
            tl.to(sel, { x: -amp * 0.8, y: amp * 0.5, duration: 0.05, ease: "none" }, t + 0.05);
            tl.to(sel, { x: 0, y: 0, duration: 0.08, ease: "power2.out" }, t + 0.1);
          }

          function makeHeart(fillId) {
            const svg = document.createElementNS(SVGNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("class", "f03-heart");
            const p = document.createElementNS(SVGNS, "path");
            p.setAttribute(
              "d",
              "M50 91 C17 65 4 46 4 29 C4 12 20 3 35 9 C43 12 48 19 50 26 C52 19 57 12 65 9 C80 3 96 12 96 29 C96 46 83 65 50 91 Z"
            );
            p.setAttribute("fill", "url(#" + fillId + ")");
            p.setAttribute("stroke", "#FFFDF5");
            p.setAttribute("stroke-width", "2");
            const hl = document.createElementNS(SVGNS, "path");
            hl.setAttribute("d", "M31 21 C22 21 14 28 14 36");
            hl.setAttribute("fill", "none");
            hl.setAttribute("stroke", "#FFFFFF");
            hl.setAttribute("stroke-width", "5");
            hl.setAttribute("stroke-linecap", "round");
            hl.setAttribute("opacity", "0.85");
            svg.appendChild(p);
            svg.appendChild(hl);
            return { svg, path: p };
          }

          function buildTunnel(host, count, fillId, heartSink) {
            const rings = [];
            const cds = [];
            for (let i = 0; i < count; i++) {
              const ring = document.createElement("div");
              ring.className = "f03-ring";
              const core = document.createElement("div");
              core.className = "f03-core";
              const n = 8;
              const R = 710;
              for (let j = 0; j < n; j++) {
                const a = (j / n) * Math.PI * 2 + i * 0.42;
                const size = 96 + ((i * 37 + j * 53) % 52);
                const orb = document.createElement("div");
                orb.className = "f03-orb";
                orb.style.width = size + "px";
                orb.style.height = size + "px";
                orb.style.left = 750 + Math.cos(a) * R - size / 2 + "px";
                orb.style.top = 750 + Math.sin(a) * R - size / 2 + "px";
                if ((i + j) % 2 === 0) {
                  const h = makeHeart(fillId);
                  orb.appendChild(h.svg);
                  heartSink.push(h.path);
                } else {
                  const cd = document.createElement("div");
                  cd.className = "f03-cd";
                  orb.appendChild(cd);
                  cds.push(cd);
                }
                core.appendChild(orb);
              }
              ring.appendChild(core);
              host.appendChild(ring);
              rings.push({ ring, core });
            }
            return { rings, cds };
          }

          function buildStreaks(host, count, seed) {
            const out = [];
            for (let i = 0; i < count; i++) {
              const s = document.createElement("div");
              s.className = "f03-streak";
              const deg = (i * 360) / count + (((i * 37) % 11) - 5) * 0.7 + seed;
              s.style.height = 360 + ((i * 67) % 320) + "px";
              s.style.transform = "rotate(" + deg + "deg)";
              s.style.background =
                i % 9 === 4
                  ? "linear-gradient(180deg, rgba(247,203,70,0.55), rgba(247,203,70,0) 88%)"
                  : "linear-gradient(180deg, var(--accSoft), rgba(0,0,0,0) 88%)";
              host.appendChild(s);
              out.push(s);
            }
            return out;
          }

          // ---------- build ----------
          const g1Hearts = [];
          const g1Build = buildTunnel(document.getElementById("f3_g1_rings"), 8, "f03_chrome", g1Hearts);
          const g1Rings = g1Build.rings;
          const g1Cds = g1Build.cds;
          const g1Streaks = buildStreaks(document.getElementById("f3_g1_streaks"), 30, 0);

          const g2Hearts = [];
          const g2Build = buildTunnel(document.getElementById("f3_g2_rings"), 12, "f03_ice", g2Hearts);
          const g2Rings = g2Build.rings;
          const g2Cds = g2Build.cds;
          const g2Streaks = buildStreaks(document.getElementById("f3_g2_streaks"), 36, 7);
          const g2Burst = buildStreaks(document.getElementById("f3_g2_burst"), 26, 11);

          const sideHost = document.getElementById("f3_g2_sideInner");
          for (let i = 0; i < 9; i++) {
            const hoop = document.createElement("div");
            hoop.className = "f03-hoop";
            hoop.style.opacity = (0.85 - i * 0.06).toFixed(2);
            hoop.style.transform =
              "translate3d(" +
              (-300 + i * 52) +
              "px," +
              (150 - i * 40) +
              "px," +
              -i * 300 +
              "px) rotateY(64deg) rotateZ(" +
              i * 5 +
              "deg)";
            sideHost.appendChild(hoop);
          }

          // ---------- group visibility (0ms cuts) ----------
          tl.set("#f3_g1", { autoAlpha: 1 }, 0);
          tl.set("#f3_g2", { autoAlpha: 0 }, 0);
          tl.set("#f3_g2", { autoAlpha: 1 }, 3.667);
          tl.set("#f3_g1", { autoAlpha: 0 }, 3.667);

          // ---------- g1: enter the tunnel, rings spawn on the beat ----------
          const g1Spawns = [0, 0.462, 0.883, 1.385, 1.811, 2.308, 2.72, 3.231];
          g1Rings.forEach((r) => {
            tl.set(r.ring, { z: -1800 }, 0);
            tl.set(r.core, { scale: 0.55, opacity: 0 }, 0);
          });
          g1Rings.forEach((r, i) => {
            const t = g1Spawns[i];
            tl.fromTo(r.ring, { z: -1800 }, { z: 400, duration: 3.8, ease: "none" }, t);
            tl.fromTo(
              r.core,
              { scale: 0.55, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" },
              t
            );
            tl.fromTo(
              r.core,
              { rotation: 0 },
              { rotation: i % 2 === 0 ? 80 : -80, duration: 4.0, ease: "none" },
              t
            );
            tl.to(r.ring, { opacity: 0, duration: 0.35, ease: "power1.in" }, t + 3.35);
          });

          g1Cds.forEach((cd, k) => {
            tl.fromTo(
              cd,
              { rotation: 0 },
              { rotation: k % 2 === 0 ? -210 : 210, duration: 4.2, ease: "none" },
              0.12 + (k % 6) * 0.04
            );
          });

          // continuous camera drift / roll
          tl.fromTo(
            "#f3_g1_rings",
            { rotation: -2, x: -24, y: 12 },
            { rotation: 2.2, x: 24, y: -16, duration: 3.667, ease: "sine.inOut" },
            0
          );

          // radial speed-line pulses
          const g1Rep = Math.max(0, Math.floor((DUR - 0.66) / 0.46) - 1);
          g1Streaks.forEach((s, i) => {
            tl.fromTo(
              s,
              { scaleY: 0.18, opacity: 0.55 },
              { scaleY: 1.6, opacity: 0.05, duration: 0.36, ease: "power2.out", repeat: g1Rep, repeatDelay: 0.1 },
              (i % 7) * 0.05
            );
          });

          // palette flip: black/pink -> black/ice-blue at 16.826 (local 1.385)
          tl.set(
            "#f3_g1",
            {
              "--acc": "#C0F7FE",
              "--accSoft": "rgba(192,247,254,0.42)",
              "--accHaze": "rgba(192,247,254,0.12)",
              "--cdfilter": "hue-rotate(-26deg) saturate(1.15)",
            },
            1.385
          );
          tl.set(g1Hearts, { fill: "url(#f3_f03_ice)" }, 1.385);
          tl.set("#f3_g1_glowPink", { autoAlpha: 0 }, 1.385);
          tl.set("#f3_g1_glowIce", { autoAlpha: 1 }, 1.385);
          tl.fromTo("#f3_g1_flash", { opacity: 0.7 }, { opacity: 0, duration: 0.2, ease: "power2.out" }, 1.385);

          // vanishing-point pulses on the beat
          const g1Beats = [0, 0.462, 0.883, 1.385, 1.811, 2.308, 2.77, 3.231];
          g1Beats.forEach((t, i) => {
            const el = i < 3 ? "#f3_g1_glowPink" : "#f3_g1_glowIce";
            tl.fromTo(el, { scale: 1, opacity: 0.85 }, { scale: 1.4, opacity: 1, duration: 0.1, ease: "power2.out" }, t);
            tl.to(el, { scale: 1, opacity: 0.85, duration: 0.32, ease: "power2.in" }, t + 0.1);
          });

          // BABY on the wall — first pass (15.903), whips away
          tl.set(
            "#f3_g1_babyA",
            { x: 660, y: -250, z: -1750, rotationY: -33, rotation: -4, autoAlpha: 1 },
            0.462
          );
          tl.fromTo("#f3_g1_babyA", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.462);
          tl.to("#f3_g1_babyA", { z: -820, duration: 0.62, ease: "power1.in" }, 0.462);
          tl.set("#f3_g1_babyA .f03-g-pink", { autoAlpha: 1 }, 0.883);
          tl.set("#f3_g1_babyA .f03-g-chrome", { autoAlpha: 0 }, 0.883);
          tl.to(
            "#f3_g1_babyA",
            { x: 1680, z: -430, rotation: 6, opacity: 0, filter: "blur(26px)", duration: 0.2, ease: "power4.in" },
            1.15
          );
          tl.set("#f3_g1_babyA", { autoAlpha: 0 }, 1.37);

          // BABY — second pass (17.252), ice then pink, whips away
          tl.set(
            "#f3_g1_babyB",
            { x: -660, y: 215, z: -1620, rotationY: 33, rotation: 4, autoAlpha: 1 },
            1.811
          );
          tl.set("#f3_g1_babyB .f03-g-chrome", { autoAlpha: 0 }, 1.811);
          tl.set("#f3_g1_babyB .f03-g-ice", { autoAlpha: 1 }, 1.811);
          tl.fromTo("#f3_g1_babyB", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 1.811);
          tl.to("#f3_g1_babyB", { z: -760, duration: 0.62, ease: "power1.in" }, 1.811);
          tl.set("#f3_g1_babyB .f03-g-pink", { autoAlpha: 1 }, 2.308);
          tl.set("#f3_g1_babyB .f03-g-ice", { autoAlpha: 0 }, 2.308);
          tl.to(
            "#f3_g1_babyB",
            { x: -1700, z: -400, rotation: -6, opacity: 0, filter: "blur(26px)", duration: 0.2, ease: "power4.in" },
            2.5
          );
          tl.set("#f3_g1_babyB", { autoAlpha: 0 }, 2.72);

          shakeGroup("#f3_g1", 1.385, 6);
          shakeGroup("#f3_g1", 3.231, 5);

          // ---------- g2: compress, accelerate, vortex ----------
          g2Rings.forEach((r) => {
            tl.set(r.ring, { z: -1200 }, 0);
            tl.set(r.core, { scale: 0.55, opacity: 0 }, 0);
          });
          g2Rings.forEach((r, i) => {
            const t0 = 3.667 + i * 0.12;
            tl.fromTo(r.ring, { z: -1200 }, { z: 400, duration: 2.2, ease: "none" }, t0);
            tl.fromTo(
              r.core,
              { scale: 0.55, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.26, ease: "back.out(2.4)" },
              t0
            );
            tl.fromTo(
              r.core,
              { rotation: 0 },
              { rotation: i % 2 === 0 ? 160 : -160, duration: 2.4, ease: "none" },
              t0
            );
            tl.to(r.ring, { opacity: 0, duration: 0.3, ease: "power1.in" }, t0 + 1.82);
            if (i === 5) tl.set(r.ring, { scale: 0.95 }, 3.693);
            if (i === 6) tl.set(r.ring, { scale: 0.9 }, 4.154);
          });

          // compression toward the centre
          tl.to(
            g2Rings.slice(0, 8).map((r) => r.ring),
            { scale: 0.62, duration: 1.33, ease: "power2.in" },
            3.667
          );
          tl.to(
            g2Rings.map((r) => r.ring),
            { scale: 0.45, duration: 0.42, ease: "power2.in" },
            5.06
          );

          g2Cds.forEach((cd, k) => {
            tl.fromTo(
              cd,
              { rotation: 0 },
              { rotation: k % 2 === 0 ? -260 : 260, duration: 2.4, ease: "none" },
              3.667 + (k % 6) * 0.03
            );
          });

          const g2Rep = Math.max(0, Math.floor((DUR - 3.9) / 0.3) - 1);
          g2Streaks.forEach((s, i) => {
            tl.fromTo(
              s,
              { scaleY: 0.2, opacity: 0.6 },
              { scaleY: 1.7, opacity: 0.05, duration: 0.26, ease: "power2.out", repeat: g2Rep, repeatDelay: 0.04 },
              3.667 + (i % 8) * 0.032
            );
          });

          // radial-burst lines on the riser
          tl.fromTo(
            g2Burst,
            { scaleY: 0.5, opacity: 0 },
            { scaleY: 1.9, opacity: 0.75, duration: 0.14, ease: "power3.out", stagger: 0.008 },
            5.06
          );
          tl.to(g2Burst, { scaleY: 2.6, opacity: 0, duration: 0.32, ease: "power2.in", stagger: 0.006 }, 5.42);

          const g2Beats = [3.693, 4.154, 4.575, 5.078, 6.001, 6.432, 6.924];
          g2Beats.forEach((t, i) => {
            const big = i === 3 || i === 4;
            tl.fromTo(
              "#f3_g2_glowIce",
              { scale: 1, opacity: 0.9 },
              { scale: big ? 1.6 : 1.35, opacity: 1, duration: 0.1, ease: "power2.out" },
              t
            );
            tl.to("#f3_g2_glowIce", { scale: 1, opacity: 0.9, duration: 0.3, ease: "power2.in" }, t + 0.1);
          });

          // whip-cut to the side-on vortex at 20.921 (local 5.480), back at 6.001
          tl.to(
            "#f3_g2_tunnel",
            { x: -1500, opacity: 0, filter: "blur(26px)", duration: 0.18, ease: "power4.in" },
            5.48
          );
          tl.set("#f3_g2_side", { autoAlpha: 1 }, 5.48);
          tl.fromTo(
            "#f3_g2_side",
            { x: 1350, opacity: 0, filter: "blur(22px)" },
            { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" },
            5.48
          );
          tl.fromTo(
            "#f3_g2_sideInner",
            { rotation: -5, scale: 1.12 },
            { rotation: 2.5, scale: 1, duration: 0.52, ease: "power2.out" },
            5.48
          );
          shakeGroup("#f3_g2", 5.48, 14);

          tl.to(
            "#f3_g2_side",
            { x: -1350, opacity: 0, filter: "blur(22px)", duration: 0.16, ease: "power4.in" },
            6.001
          );
          tl.set("#f3_g2_side", { autoAlpha: 0 }, 6.18);
          tl.set("#f3_g2_tunnel", { autoAlpha: 1 }, 6.001);
          tl.fromTo(
            "#f3_g2_tunnel",
            { x: 1150, opacity: 0, filter: "blur(20px)" },
            { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "power3.out", immediateRender: false },
            6.001
          );

          // BABY flashes on the kicks
          function babyFlash(t, glyphSel) {
            tl.set("#f3_g2_baby", { autoAlpha: 1 }, t);
            tl.set("#f3_g2_baby .f03-glyph", { autoAlpha: 0 }, t);
            tl.set(glyphSel, { autoAlpha: 1 }, t);
            tl.fromTo(
              "#f3_g2_baby",
              { scale: 1.45, x: -70, rotation: -3, filter: "blur(0px)" },
              { scale: 1, x: 0, rotation: 0, duration: 0.12, ease: "power3.out" },
              t
            );
            tl.to(
              "#f3_g2_baby",
              { autoAlpha: 0, x: 320, filter: "blur(18px)", duration: 0.15, ease: "power3.in" },
              t + 0.2
            );
          }
          babyFlash(5.48, "#f3_g2_baby .f03-g-pink");
          babyFlash(6.432, "#f3_g2_baby .f03-g-ice");
          babyFlash(6.924, "#f3_g2_baby .f03-g-chrome");
          shakeGroup("#f3_g2", 6.432, 9);
          shakeGroup("#f3_g2", 6.924, 9);

          // the vortex closes to a black circle with a thin chrome rim
          tl.set("#f3_g2_collapse", { autoAlpha: 1 }, 6.95);
          tl.fromTo(
            "#f3_g2_rimWrap",
            { scale: 3.0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.4, ease: "power3.inOut" },
            6.95
          );
          tl.to("#f3_g2_tunnel", { opacity: 0, duration: 0.3, ease: "power1.in" }, 6.95);
          tl.fromTo(
            g2Burst,
            { scaleY: 1.5, opacity: 0.65 },
            { scaleY: 0.08, opacity: 0, duration: 0.3, ease: "power2.in", stagger: 0.004 },
            6.95
          );

          window.__timelines["03-f3"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
