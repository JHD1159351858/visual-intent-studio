<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>枝语 · 聊天助手演示</title>
<style>
:root{--bg:#edf3ef;--surface:#ffffff;--ink:#203b32;--muted:#64786e;--accent:#246b50;--line:#d6e3db;--font-body:"Segoe UI","Microsoft YaHei",sans-serif;--font-display:"Georgia","SimSun",serif;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--font-body)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{border:0}button,input,textarea,select{max-width:100%}h1,h2,p{margin:0}h1{font:500 43px/1.3 var(--font-display)}h2{font-size:18px}.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}.sidebar{padding:36px 24px;background:var(--ink);color:var(--surface);display:flex;flex-direction:column;gap:28px}.brand{font:600 25px var(--font-display);display:flex;gap:10px;align-items:center}.brand-mark{border:1px solid var(--line);border-radius:50%;width:35px;height:35px;display:grid;place-items:center}.nav-label{font-size:12px;letter-spacing:.08em;opacity:.65}.new-chat{padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--surface);text-align:left}.sidebar .current{padding:12px;border-radius:12px;background:var(--accent)}.note{font-size:12px;line-height:1.7;opacity:.75;margin-top:auto}.main{max-width:1120px;width:100%;padding:36px 52px;margin:auto;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:40px}.badge{display:inline-flex;gap:8px;align-items:center;font-size:12px;border:1px solid var(--line);padding:5px 10px;border-radius:20px}.dot{width:7px;height:7px;background:var(--accent);border-radius:50%}.mode{background:transparent;border:0;color:var(--muted);padding:5px}.welcome{padding:22px 0 32px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.15em;margin-bottom:12px}.welcome p{color:var(--muted);margin-top:16px;max-width:540px}.workspace{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.conversation{padding:32px;min-height:285px;display:flex;flex-direction:column;gap:18px}.empty{margin:auto;text-align:center;max-width:420px}.empty-icon{font:48px var(--font-display);color:var(--accent);margin-bottom:14px}.empty p{font-size:14px;color:var(--muted);margin-top:8px}.message{max-width:88%;padding:14px 18px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.message.user{background:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}.message.assistant{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}.message-label{font-size:11px;color:var(--accent);margin-bottom:6px;display:block}.loading{color:var(--muted);font-size:14px}.loading span{display:inline-block;animation:pulse 1s infinite}.error{border:1px solid var(--accent);padding:14px;border-radius:12px;font-size:14px}.error button{margin-top:8px;color:var(--accent);text-decoration:underline;background:transparent;padding:6px 0}.composer{border-top:1px solid var(--line);padding:20px 24px}.composer textarea{width:100%;resize:vertical;min-height:72px;border:0;background:transparent;color:var(--ink);outline-offset:0}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.composer small{color:var(--muted);font-size:11px}.primary{background:var(--accent);color:var(--surface);border-radius:10px;padding:10px 22px;font-weight:600;white-space:nowrap}.secondary{background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 16px}.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.suggestions button{padding:8px 12px;border:1px solid var(--line);border-radius:20px;color:var(--ink);background:transparent;font-size:12px}.foot{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.link{background:transparent;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}@keyframes pulse{50%{opacity:.35}}@media(max-width:900px){.main{padding:28px}.app{grid-template-columns:190px minmax(0,1fr)}.sidebar{padding:28px 18px}h1{font-size:36px}}@media(max-width:640px){.app{display:block}.sidebar{padding:18px 20px;display:flex;flex-direction:row;align-items:center;justify-content:space-between}.sidebar .history,.sidebar .note{display:none}.sidebar .new-chat{font-size:12px;padding:8px}.brand{font-size:20px}.brand-mark{width:28px;height:28px}.main{padding:24px 18px}.topbar{margin-bottom:20px}.welcome{padding-top:4px}h1{font-size:32px}.conversation{padding:20px;min-height:280px}.composer{padding:16px}.composer small{max-width:150px}.message{max-width:96%}.foot{align-items:flex-start}.mode{width:112px}}
.foot summary{cursor:pointer}.foot details p{margin-top:8px;max-width:450px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body><div class="app"><aside class="sidebar" id="chat-navigation"><div class="brand"><span class="brand-mark">枝</span>枝语</div><button class="new-chat" id="new-chat">＋ 新建对话</button><div class="history"><div class="nav-label">当前会话</div><div class="current">今天，整理一个想法</div></div><p class="note">让零散的想法<br>长成清楚的下一步。</p></aside><main class="main" id="chat-workspace" data-state="empty"><div class="topbar"><span class="badge"><i class="dot"></i>本地交互演示</span><label>工作方式 <select id="mode" class="mode" aria-label="工作方式"><option>思路整理</option><option>行动计划</option><option>学习伙伴</option></select></label></div><section class="welcome" id="chat-introduction"><div class="eyebrow">留一点时间，想清楚</div><h1>你好，今天从哪里开始？</h1><p>写下你的问题、计划或还没成形的想法。我们可以把它拆成几件值得做的小事。</p></section><section class="workspace" id="chat-conversation" aria-label="聊天会话"><div class="conversation" id="messages" aria-live="polite"><div class="empty"><div class="empty-icon">⌁</div><h2>一个想法就够了</h2><p>从下面的例子开始，或直接写下你的问题。此演示使用本地规则生成回复。</p></div></div><form class="composer" id="chat-form"><label for="prompt" class="message-label">你的想法</label><textarea id="prompt" placeholder="例如：帮我安排一周的学习计划" maxlength="800"></textarea><div class="composer-bottom"><small>Enter 发送 · Shift + Enter 换行</small><div><button type="button" class="secondary" id="cancel" hidden>停止</button> <button class="primary" id="send">发送 ↗</button></div></div></form></section><section class="suggestions" id="chat-suggestions" aria-label="示例问题"><button type="button" data-prompt="帮我安排一周的学习计划">安排一周的学习计划</button><button type="button" data-prompt="把我的项目想法变成行动清单">把想法变成行动清单</button><button type="button" data-prompt="准备一次10分钟的项目汇报">准备一次项目汇报</button></section><div class="foot" id="chat-status"><details><summary>本地演示说明</summary><p>使用页面内的规则回复，不连接 AI 服务。工作方式决定回复结构，内容仅供体验。</p></details><button class="link" id="fail">演示失败状态</button></div></main></div>
<script>
(()=>{const $=id=>document.getElementById(id),main=$('chat-workspace'),messages=$('messages');let timer,last='',run=0;const setState=s=>main.dataset.state=s;function node(text,kind){const n=document.createElement('div');n.className='message '+kind;const l=document.createElement('span');l.className='message-label';l.textContent=kind==='user'?'你':'枝语 · 演示回复';n.append(l,document.createTextNode(text));messages.append(n);return n}function busy(value){$('send').disabled=value;$('prompt').disabled=value;$('cancel').hidden=!value}function fail(){setState('error');const e=document.createElement('div');e.className='error';e.id='chat-error';e.append(document.createTextNode('本次演示回复未完成。你的问题已保留，可以重试。'));const b=document.createElement('button');b.textContent='重试回复';b.onclick=()=>{e.remove();answer(last,false)};e.append(document.createElement('br'),b);messages.append(e);busy(false)}function answer(text,forced){last=text;const token=++run;setState('loading');busy(true);const wait=document.createElement('div');wait.className='loading';wait.innerHTML='<span>●</span> 正在整理你的想法…';messages.append(wait);timer=setTimeout(()=>{if(token!==run)return;wait.remove();if(forced){fail();return}const topic=text.replace(/[。！？]/g,'').slice(0,70),mode=$('mode').value;const reply=mode==='学习伙伴'?`我们把「${topic}」分成三个学习环节。\n\n先用 10 分钟列出已经理解的部分；再用 25 分钟练习最不确定的一项；最后用 5 分钟写下自己的解释。\n\n每次只验证一个知识点，明天从今天卡住的地方继续。`:mode==='行动计划'?`围绕「${topic}」，可以这样推进：\n\n□ 今天：写下明确的完成标准。\n□ 下一步：拆出一个 30 分钟内能完成的任务。\n□ 完成后：记录结果，再决定第二步。\n\n先从最小的一步开始，你最希望优先解决哪一部分？`:`你提到「${topic}」。我们先把目标收拢。\n\n1. 明确结果：你希望最后得到什么？\n2. 划定范围：列出必须完成的两件事。\n3. 安排节奏：每天留出 30 分钟推进，并在周末复盘。\n\n如果是学习计划，建议前两天梳理基础，中间三天练习，最后两天总结与调整。`;node(reply,'assistant');setState('result');busy(false);$('prompt').focus()},650)}function send(forced=false){const text=$('prompt').value.trim();if(!text){setState('error');$('prompt').setAttribute('aria-invalid','true');$('prompt').placeholder='先写下一句话，再发送';$('prompt').focus();return}if(main.dataset.state==='empty'||!messages.querySelector('.message'))messages.replaceChildren();$('prompt').removeAttribute('aria-invalid');$('prompt').placeholder='例如：帮我安排一周的学习计划';node(text,'user');$('prompt').value='';answer(text,forced)}$('chat-form').onsubmit=e=>{e.preventDefault();send()};$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.prompt;send()});$('new-chat').onclick=()=>{clearTimeout(timer);run++;messages.innerHTML='<div class="empty"><div class="empty-icon">⌁</div><h2>一个想法就够了</h2><p>写下你的问题，开始一段新的本地演示对话。</p></div>';$('prompt').value='';busy(false);setState('empty')};$('cancel').onclick=()=>{clearTimeout(timer);run++;messages.querySelector('.loading')?.remove();busy(false);setState('result');node('已停止。你可以继续补充问题。','assistant')};$('fail').onclick=()=>{if(main.dataset.state==='loading')return;$('prompt').value='帮我整理明天的计划';send(true)}})();
</script></body></html>
