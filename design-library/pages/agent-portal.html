<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>启航 · 智能体门户演示</title><style>
:root{--bg:#eef6f6;--surface:#fff;--ink:#183f4b;--muted:#648089;--accent:#207f8f;--line:#c8e1e3;--font-body:"Segoe UI","Microsoft YaHei",sans-serif;--font-display:"Georgia","SimSun",serif;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 var(--font-body)}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,h3,p{margin:0}.header{max-width:1400px;margin:auto;padding:22px 5vw;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font:600 25px var(--font-display);display:flex;gap:10px;align-items:center}.brand svg{width:30px;height:30px;color:var(--accent)}.header-note{font-size:12px;color:var(--muted)}main{max-width:1400px;margin:auto;padding:0 5vw 36px}.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:20px;background:var(--ink);color:var(--surface);padding:38px 42px;border-radius:var(--radius);position:relative;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:.12em;margin-bottom:18px;color:var(--line)}.hero h1{font:500 43px/1.3 var(--font-display);max-width:680px}.hero p{color:var(--line);font-size:14px;margin-top:16px;max-width:490px}.compass{display:flex;align-items:center;justify-content:center}.compass svg{width:220px;height:205px;max-width:100%;color:var(--line)}.search{display:flex;gap:8px;background:var(--surface);padding:7px;border:1px solid var(--line);border-radius:12px;margin-top:25px;max-width:550px}.search input{background:transparent;border:0;color:var(--ink);padding:9px 10px;min-width:0;flex:1}.primary{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:10px 20px;font-weight:600;white-space:nowrap}.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 15px}.directory{margin-top:28px}.directory-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.directory-head h2{font-size:19px}.directory-head span{font-size:12px;color:var(--muted)}.categories{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:23px}.categories button{border:1px solid var(--line);border-radius:22px;padding:7px 17px;color:var(--ink);background:transparent;font-size:12px}.categories button[aria-pressed=true]{background:var(--accent);color:var(--surface);border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;align-items:flex-start;min-width:0}.card.featured{grid-column:span 2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.5fr);gap:20px;background:var(--surface)}.card-top{display:flex;align-items:center;gap:13px;margin-bottom:14px}.agent-icon{width:42px;height:42px;background:var(--bg);color:var(--accent);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;font:22px var(--font-display);flex:none}.card-tag{font-size:11px;color:var(--muted)}.card h3{font-size:18px;font-weight:600}.card p{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.8;flex:1}.card button{margin-top:18px}.card-meta{font-size:10px;color:var(--muted);margin-top:12px}.feature-map{align-self:center;font-family:var(--font-display);text-align:center;color:var(--accent);padding:14px;border:1px solid var(--line);border-radius:50%;aspect-ratio:1;width:150px;max-width:100%;display:grid;place-content:center}.feature-map b{font-size:35px;font-weight:400}.feature-map span{font:11px var(--font-body);color:var(--muted)}.notice{background:var(--surface);border:1px solid var(--line);padding:38px 24px;text-align:center;border-radius:var(--radius)}.notice h3{font-size:19px}.notice p{color:var(--muted);margin:12px 0 18px}.footer{font-size:11px;color:var(--muted);margin-top:26px;display:flex;justify-content:space-between;gap:14px}.link{border:0;background:transparent;color:var(--muted);font-size:11px;padding:0;text-decoration:underline}.loading-dot{display:inline-block;height:8px;width:8px;background:var(--accent);border-radius:50%;margin-right:8px;animation:pulse 1s ease-in-out infinite}dialog{width:min(650px,92vw);border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:28px;max-height:90vh;overflow:auto}dialog::backdrop{background:#183f4b88}.dialog-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.dialog-head h2{font-size:22px}.close{border:1px solid var(--line);background:transparent;color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:18px}.dialog-intro{font-size:13px;color:var(--muted);margin:14px 0 20px}.task-label{font-size:12px;font-weight:600;display:block;margin-bottom:8px}.task-input{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);resize:vertical;background:var(--bg)}.task-actions{margin:14px 0 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}.task-result{border-top:1px solid var(--line);padding-top:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.85;color:var(--muted)}.task-result.result{color:var(--ink)}.task-result.error{color:var(--accent)}@keyframes pulse{50%{opacity:.3}}@media(max-width:950px){.hero{padding:32px}.hero h1{font-size:36px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card.featured{grid-column:span 1;display:flex}.feature-map{display:none}.compass svg{width:180px}.card{padding:22px}}@media(max-width:640px){.header{padding:18px}.header-note{font-size:10px;max-width:170px;text-align:right}main{padding:0 18px 28px}.hero{padding:27px 22px;display:block}.hero h1{font-size:32px}.hero p{font-size:13px}.compass{display:none}.search input{font-size:12px;padding:8px 4px}.search button{font-size:12px;padding:9px 12px}.search{margin-top:22px}.directory-head{gap:8px}.directory-head h2{font-size:18px}.directory-head span{font-size:11px}.categories{gap:7px}.categories button{padding:7px 13px}.grid{grid-template-columns:1fr;gap:14px}.card{padding:22px}.card h3{font-size:18px}.footer{flex-direction:column;align-items:flex-start}dialog{padding:22px}.task-actions{align-items:flex-start}.dialog-head h2{font-size:21px}}
.card:nth-child(2){grid-column:span 2}@media(max-width:950px){.card:nth-child(2){grid-column:auto}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="header" id="portal-header"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="13" stroke="currentColor"/><path d="m11 21 3-10 7 2-3 8zM14 11l4 10" stroke="currentColor" stroke-width="1.4"/></svg>启航</div><span class="header-note">为眼前的任务，找到合适的工具。</span></header><main id="portal-workspace" data-state="result"><section class="hero" id="portal-introduction"><div><div class="eyebrow">智能体工具集 / 本地任务演示</div><h1>你负责想法，<br>工具陪你向前一步。</h1><p>从学习、写作到工作整理，选择适合任务的助手。每个入口都提供一段可以亲手操作的本地体验。</p><form class="search" id="portal-search"><input id="agent-query" aria-label="搜索智能体" maxlength="100" placeholder="搜索工具名称或任务，例如：写作"><button class="primary" id="search">搜索工具 ↗</button></form></div><div class="compass"><svg viewBox="0 0 240 210" fill="none" aria-hidden="true"><circle cx="120" cy="105" r="80" stroke="currentColor" opacity=".3"/><circle cx="120" cy="105" r="56" stroke="currentColor" opacity=".4"/><path d="M120 12v22M120 176v22M27 105h22M191 105h22M54 39l16 16M170 155l16 16M54 171l16-16M170 55l16-16" stroke="currentColor"/><path d="m94 132 15-65 37 12-15 65z" stroke="currentColor" stroke-width="2"/><path d="m109 67 22 77M94 132l52-53" stroke="currentColor"/><circle cx="120" cy="105" r="4" fill="currentColor"/><text x="120" y="20" text-anchor="middle" font-size="10" fill="currentColor">N</text></svg></div></section><section class="directory" id="portal-directory"><div class="directory-head"><h2>找到你的下一位助手</h2><span id="result-count">6 个演示工具</span></div><div class="categories" id="portal-categories" aria-label="智能体分类"><button aria-pressed="true" data-category="全部">全部</button><button aria-pressed="false" data-category="学习">学习</button><button aria-pressed="false" data-category="创作">创作</button><button aria-pressed="false" data-category="办公">办公</button><button aria-pressed="false" data-category="分析">分析</button></div><div class="grid" id="agents"></div></section><footer class="footer" id="portal-status"><span>所有工具均为本地演示 · 不代表已上线智能体或外部 AI 服务</span><button class="link" id="portal-fail">演示目录读取失败</button></footer></main><dialog id="agent-dialog" aria-labelledby="agent-title"><div class="dialog-head"><h2 id="agent-title"></h2><button class="close" id="close-agent" aria-label="关闭工具">×</button></div><p class="dialog-intro" id="agent-description"></p><label class="task-label" for="agent-task">你的任务</label><textarea class="task-input" id="agent-task" maxlength="1000"></textarea><div class="task-actions"><button class="link" id="task-example">填入示例</button><button class="primary" id="run-task">运行本地演示</button></div><div class="task-result" id="task-result" aria-live="polite">输入任务后，结果会显示在这里。</div></dialog><script>
(()=>{const $=id=>document.getElementById(id),main=$('portal-workspace');const agents=[{id:'study',name:'学习路线助手',category:'学习',icon:'学',description:'把一个学习目标拆成可执行的练习与复盘节奏。',example:'我想在一周内了解网页开发基础',keywords:'计划 课程 学习 路线 练习',featured:true},{id:'writing',name:'文字精简助手',category:'创作',icon:'文',description:'去掉草稿里的冗余表达，保留你的原意。',example:'我觉得我们可以进行一个简单的测试，然后再根据测试的结果进行改进。',keywords:'写作 文案 润色 改写 精简'},{id:'knowledge',name:'知识检索助手',category:'学习',icon:'问',description:'在本地演示材料里，查找学习与汇报的基本方法。',example:'项目汇报需要包含哪些内容？',keywords:'知识库 引用 问答 来源'},{id:'report',name:'汇报结构助手',category:'办公',icon:'报',description:'围绕已有材料，组织一份清楚的汇报提纲。',example:'学习工具原型已经完成，需要汇报下一阶段计划',keywords:'报告 汇报 提纲 工作流'},{id:'analysis',name:'数据读数助手',category:'分析',icon:'数',description:'查看课程样本的完成率，了解指标的统计口径。',example:'请分析课程的完成率',keywords:'数据 图表 统计 指标 分析'},{id:'plan',name:'行动清单助手',category:'办公',icon:'行',description:'从一项任务中，列出目标、第一步与完成标准。',example:'准备一次10分钟的项目汇报',keywords:'任务 计划 清单 日程 办公'}];let category='全部',selected,timer,taskTimer;function open(a){selected=a;$('agent-title').textContent=a.name;$('agent-description').textContent=a.description+' 此工具使用固定本地规则，不调用 AI。';$('agent-task').value='';$('agent-task').placeholder=a.example;$('task-result').className='task-result';$('task-result').textContent='输入任务后，结果会显示在这里。';$('run-task').disabled=false;$('agent-dialog').showModal()}function render(list){$('agents').className='grid';$('agents').replaceChildren();$('result-count').textContent=list.length+' 个演示工具';list.forEach(a=>{const card=document.createElement('article');card.className='card'+(a.featured&&list.length===6?' featured':'');const content=document.createElement('div'),top=document.createElement('div');top.className='card-top';const icon=document.createElement('span');icon.className='agent-icon';icon.textContent=a.icon;const tag=document.createElement('span');tag.className='card-tag';tag.textContent=a.category+' / 本地演示';top.append(icon,tag);const title=document.createElement('h3');title.textContent=a.name;const p=document.createElement('p');p.textContent=a.description;const b=document.createElement('button');b.className='secondary';b.textContent='打开工具 ↗';b.setAttribute('aria-label','打开 '+a.name);b.onclick=()=>open(a);const meta=document.createElement('div');meta.className='card-meta';meta.textContent='输入任务 → 查看结果';content.append(top,title,p,b,meta);card.append(content);if(a.featured&&list.length===6){const map=document.createElement('div');map.className='feature-map';map.innerHTML='<b>目标</b><span>练习 → 复盘 → 调整</span>';card.append(map)}$('agents').append(card)})}function filter(forced=false){main.dataset.state='loading';$('search').disabled=true;$('agents').className='notice';$('agents').innerHTML='<span class="loading-dot"></span>正在整理工具目录…';clearTimeout(timer);timer=setTimeout(()=>{$('search').disabled=false;if(forced){main.dataset.state='error';$('agents').innerHTML='<h3>本次演示目录读取失败</h3><p>搜索词与分类已保留，重新读取即可恢复。</p><button class="secondary" id="portal-retry">重新读取</button>';$('portal-retry').onclick=()=>filter();return}const q=$('agent-query').value.trim().toLowerCase(),list=agents.filter(a=>(category==='全部'||a.category===category)&&(!q||(a.name+a.description+a.keywords).toLowerCase().includes(q)));if(!list.length){main.dataset.state='empty';$('result-count').textContent='0 个结果';$('agents').innerHTML='<h3>还没有找到合适的工具</h3><p>试试「写作」「学习」或「报告」，也可以清空筛选。</p><button class="secondary" id="portal-reset">查看全部工具</button>';$('portal-reset').onclick=()=>{$('agent-query').value='';category='全部';document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)));filter()};return}render(list);main.dataset.state='result'},400)}$('portal-search').onsubmit=e=>{e.preventDefault();filter()};document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));filter()});$('portal-fail').onclick=()=>{if(main.dataset.state!=='loading')filter(true)};$('task-example').onclick=()=>{$('agent-task').value=selected.example;$('agent-task').focus()};$('run-task').onclick=()=>{const text=$('agent-task').value.trim();if(!text){$('task-result').className='task-result error';$('task-result').textContent='先写下一项任务，或点击「填入示例」再运行。';$('agent-task').focus();return}const agent=selected;$('run-task').disabled=true;$('task-result').className='task-result';$('task-result').textContent='正在运行本地演示…';clearTimeout(taskTimer);taskTimer=setTimeout(()=>{let out='';if(agent.id==='writing')out=text.replace(/我觉得|一个|然后再/g,'').replace(/进行一个/g,'进行').replace(/进行改进/g,'改进').replace(/根据测试的结果/g,'根据测试结果');else if(agent.id==='knowledge')out=text.includes('汇报')?'演示资料《项目汇报手册》：\n汇报依次说明问题、已完成工作、验证证据和下一步。[本地来源 1]\n\n十分钟汇报可按 2、4、2、2 分钟分配。':'演示资料《学习计划指南》：\n先定义可观察的目标，再安排短练习。每周回看未完成任务并调整计划。[本地来源 2]';else if(agent.id==='analysis')out='课程演示样本：82%、92%、76%、68%、88%、79%。\n\n简单平均完成率：81%。\n最高：交互设计 92%；最低：网页开发 68%。\n\n先核对单位和统计范围，再作比较。以上为本地固定样本。';else if(agent.id==='report')out='汇报提纲：'+text+'\n\n一、问题与目标：说明要解决的具体问题。\n二、已有工作：放入已完成内容与对应证据。\n三、待确认事项：列出尚未验证的部分。\n四、下一步：补充负责人、时间与验收方式。';else if(agent.id==='study')out='学习目标：'+text+'\n\n第 1–2 天：梳理基础，列出三个需要掌握的知识点。\n第 3–5 天：每天完成一个短练习，并记录卡住的地方。\n第 6–7 天：用自己的话解释知识点，复盘后调整下一周。\n\n这是可继续修改的本地示例计划。';else out='任务：'+text+'\n\n□ 明确最后要交付什么。\n□ 找出一个 30 分钟内可以完成的第一步。\n□ 为第一步写下完成标准。\n□ 完成后检查结果，再安排下一项。';$('task-result').textContent=out;$('task-result').className='task-result result';$('run-task').disabled=false},620)};$('close-agent').onclick=()=>{clearTimeout(taskTimer);$('agent-dialog').close()};$('agent-dialog').addEventListener('cancel',()=>clearTimeout(taskTimer));render(agents)})();
</script></body></html>
