<body>
<div class=shell>
<header class=topbar><a class=brand href="#reading-room" aria-label="字间诗意阅读室"><span class=seal aria-hidden=true>字</span><div><div class=brand-name>字间</div><div class=brand-sub>诗意阅读室</div></div></a><div class=top-tools><a href="#reading-room">读一首诗</a><a href="#poem-notes">解一行字</a><button class=motion id=motion-toggle type=button aria-pressed=false><span class=motion-icon aria-hidden=true></span><span id=motion-label>暂停山水</span></button></div></header>
<section class=intro id=reading-intro><div><p class=eyebrow>唐诗三首 · 给日常一小段留白</p><h1>让心，落在<em>一首诗</em>里。</h1></div><p class=intro-note>山水有回声，字句有余温。<br>从喜欢的一行，慢慢读起。</p></section>
<main class=reader id=reading-room aria-label="诗意阅读室">
<aside class=collection aria-label="选一首诗"><p class=section-tag>此间诗选</p><button class=poem-select type=button data-poem=autumn aria-pressed=true><span class=pick-title>山居秋暝</span><span class=pick-author>王维 · 山中秋夜</span></button><button class=poem-select type=button data-poem=spring aria-pressed=false><span class=pick-title>春晓</span><span class=pick-author>孟浩然 · 春日清晨</span></button><button class=poem-select type=button data-poem=night aria-pressed=false><span class=pick-title>静夜思</span><span class=pick-author>李白 · 月夜乡思</span></button><p class=shelf-note>读过的风景，<br>会留在<span>心里</span>。</p></aside>
<div class=reading><div class=tabs role=tablist aria-label="阅读方式"><button type=button class=tab id=tab-original role=tab aria-selected=true aria-controls=view-original data-view=original>原文</button><button type=button class=tab id=tab-analysis role=tab aria-selected=false aria-controls=view-analysis data-view=analysis tabindex=-1>赏析</button><button type=button class=tab id=tab-practice role=tab aria-selected=false aria-controls=view-practice data-view=practice tabindex=-1>练习</button></div>
<section class=view id=view-original role=tabpanel aria-labelledby=tab-original><div class=poem-head><h2 id=poem-title>山居秋暝</h2><p id=poem-author>唐 · 王维</p></div><div class=poem-lines id=poem-lines></div><p class=hint>轻点诗句，读一行<span>注解</span></p><div class=poem-foot id=poem-type>五言律诗 · 山水田园</div></section>
<section class="view analysis" id=view-analysis role=tabpanel aria-labelledby=tab-analysis hidden><p class=view-kicker>把诗读近一点</p><h2 id=analysis-title></h2><div id=analysis-copy></div><p class=reflection id=reflection></p></section>
<section class="view practice" id=view-practice role=tabpanel aria-labelledby=tab-practice hidden><p class=view-kicker>读完，再想一想</p><h2>两道小题，回望诗中。</h2><form id=quiz-form><div id=questions></div><button class=submit-quiz type=submit>查看答案与解析</button><p class=result id=result role=status></p></form></section>
</div>

</main>

<script>const poems={autumn:{title:"山居秋暝",author:"王维",type:"五言律诗 · 山水田园",char:"空",caption:"明月松间照",lines:["空山新雨后，","天气晚来秋。","明月松间照，","清泉石上流。","竹喧归浣女，","莲动下渔舟。","随意春芳歇，","王孙自可留。"],notes:["新雨过后，山中空明而清新。“空山”写幽静，也写心境的澄澈。","傍晚凉意渐起，秋意来到山中。“暝”指日落时分。","月光穿过松林。一个“照”字，让静夜有了清晰的光影。","清泉从石上流过，轻轻的水声衬出山林的安静。","竹林传来喧笑，是洗衣的女子们归来了。“浣女”指洗衣女子。","莲叶摇动，原来是渔舟顺流而下。先有动静，再见人物。","任凭春天的芳花消歇。“随意”在这里意为任凭。","“王孙”原指贵族子弟，此处诗人借来自指：秋景可爱，愿留山中。"],analysisTitle:"山中有声，心中有静。",analysis:["新雨洗亮了秋山。前四句从雨后空气写到月光、泉水：松间是光，石上是水。不说“宁静”，却处处宁静。","后四句有洗衣人归来，有渔舟顺流。人的日常与山中清幽彼此相容。不必等待春花，眼前秋山已足以安放身心。"],prompt:"再读一遍：诗中哪些声音，反而让你觉得更安静？",quiz:[{q:"“竹喧”的声音，来自谁？",options:["归来的洗衣女子","远去的行军队伍","山中的鸣蝉"],answer:0,why:"“浣女”指洗衣的女子；竹林的喧笑引出了她们。"},{q:"诗人结尾表达了怎样的心意？",options:["盼望马上离开秋山","愿意留在眼前的山中","惋惜渔舟无人归来"],answer:1,why:"“王孙自可留”回应山中美景，写出愿意留下的心意。"}]},spring:{title:"春晓",author:"孟浩然",type:"五言绝句 · 惜春",char:"晓",caption:"处处闻啼鸟",lines:["春眠不觉晓，","处处闻啼鸟。","夜来风雨声，","花落知多少。"],notes:["春夜睡得香甜，不知不觉天已亮了。“晓”指天亮、清晨。","四处都能听见鸟啼。还未走出门，先从声音感知春晨。","回想夜里，曾听见风雨声。人仍在屋内，思绪已转向昨夜。","风雨之后，不知道花落了多少。一个疑问，藏着对春花的怜惜。"],analysisTitle:"未出门，春天已到耳边。",analysis:["诗从“听”开始：醒来有鸟鸣，回想中有风雨。两种声音，把清晨与昨夜悄悄接在一起。","初醒的轻快，转为对落花的牵挂。诗人没有把惜春说尽。“知多少”的问句，让二十个字留下很长的余味。"],prompt:"再想一想：从“啼鸟”到“花落”，诗人的心情有了什么变化？",quiz:[{q:"“晓”在“春眠不觉晓”中是什么意思？",options:["知道","天亮、清晨","傍晚"],answer:1,why:"这里的“晓”指天亮，写春日醒来的时刻。"},{q:"诗的最后一句，流露出怎样的心情？",options:["对春花的怜惜与牵挂","对行路艰难的担忧","对丰收的喜悦"],answer:0,why:"诗人由夜间风雨想到花落，含蓄地表达了惜春之情。"}]},night:{title:"静夜思",author:"李白",type:"五言绝句 · 思乡",char:"思",caption:"举头望明月",lines:["床前明月光，","疑是地上霜。","举头望明月，","低头思故乡。"],notes:["床前洒着明亮的月光。诗从眼前的一片光亮写起，场景简净。","朦胧中，月光仿佛是一层霜。“疑”是怀疑、以为，并非真的下霜。","抬头望月：目光由地上的月光，移向月亮本身。","低头思乡。抬头与低头之间，景色转成了心事。"],analysisTitle:"一抬头，是月；一低头，是家。",analysis:["床前月光像霜，带着夜色的清冷。“疑”字写出瞬间的恍惚，让感受亲近而自然。","举头、低头，视线由外转向内，明月牵出了故乡。诗未交代家乡有谁，因此每个远行的人，都能在这片空白里放入自己的思念。"],prompt:"再读一遍：“举头”与“低头”，怎样把眼前景和心中情连接起来？",quiz:[{q:"“疑是地上霜”中的“霜”指什么？",options:["屋内真的结了一层霜","诗人把月光恍惚看作霜","窗外飘进来的雪"],answer:1,why:"“疑是”写一瞬间的错觉，以霜比拟清冷的月光。"},{q:"后两句的情感变化，最贴近哪一项？",options:["从看月亮转为思念家乡","从赏花转为感叹春逝","从望山转为赞美丰收"], "original")}document.querySelectorAll(".poem-select").forEach((e=>e.addEventListener("click",(()=>selectPoem(e.dataset.poem))))),tabs.forEach(((e,t)=>{e.addEventListener("click",(()=>showView(e.dataset.view))),e.addEventListener("keydown",(e=>{let n;if("ArrowRight"===e.key)n=(t+1)%tabs.length;else if("ArrowLeft"===e.key)n=(t+tabs.length-1)%tabs.length;else if("Home"===e.key)n=0;else{if("End"!==e.key)return;n=tabs.length-1}e.preventDefault(),showView(tabs[n].dataset.view),tabs[n].focus()}))})),$("quiz-form").addEventListener("submit",(e=>{e.preventDefault();const t=poems[current],n=t.quiz.map(((e,t)=>document.querySelector('input[name="question-'+t+'"]:checked')));if(n.some((e=>!e)))return void($("result").textContent="先完成两题，再查看答案与解析。");const a=n.reduce(((e,n,a)=>e+(Number(n.value)===t.quiz[a].answer?1:0)),0);$("result").textContent="答对 "+a+" / 2 题。\n"+t.quiz.map(((e,t)=>t+1+". "+(Number(n[t].value)===e.answer?"答对了。":"再读一遍：正确答案是“"+e.options[e.answer]+"”。")+e.why)).join("\n")}));const motionPreference=window.matchMedia("(prefers-reduced-motion: reduce)");function setPaused(e){document.documentElement.dataset.paused=String(e),$("motion-toggle").setAttribute("aria-pressed",String(e)),$("motion-label").textContent=e?"继续山水":"暂停山水"}setPaused(motionPreference.matches),motionPreference.addEventListener("change",(e=>{e.matches&&setPaused(!0)})),$("motion-toggle").addEventListener("click",(()=>setPaused("true"!==document.documentElement.dataset.paused))),selectPoem("autumn");</script>
