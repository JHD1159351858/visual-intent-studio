<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稿笺 · 写作工具演示</title><style>
:root{--bg:#f8f2d9;--surface:#fffef7;--ink:#33372d;--muted:#7c7c68;--accent:#aa4937;--line:#ddd9bb;--font-body:"Segoe UI","Microsoft YaHei",sans-serif;--font-display:"Georgia","SimSun",serif;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--font-body)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,p{margin:0}.header{max-width:1440px;margin:auto;padding:22px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font:600 26px var(--font-display);display:flex;gap:12px;align-items:center}.brand i{font-style:normal;background:var(--accent);color:var(--surface);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px}.header-note{font-size:12px;color:var(--muted)}main{max-width:1440px;margin:auto;padding:38px 5vw}.intro{display:flex;justify-content:space-between;gap:30px;align-items:flex-end;margin-bottom:30px}.intro h1{font:500 42px/1.3 var(--font-display)}.intro h1 em{font-style:normal;color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px}.intro p{margin-top:14px;color:var(--muted);max-width:570px}.edition{font-size:12px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;padding-bottom:6px}.tools{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 18px;color:var(--ink);font-size:13px}.tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}.tone{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.tone select{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:8px 3px}.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0;box-shadow:0 8px 0 -4px var(--line)}.sheet-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.sheet h2{font-size:16px}.sheet-head small{font-size:11px;color:var(--muted)}.sheet-body{padding:24px;min-height:340px;background:repeating-linear-gradient(transparent 0,transparent 31px,var(--line) 32px,transparent 33px);background-position:0 12px}.sheet textarea{width:100%;resize:vertical;min-height:298px;border:0;background:transparent;color:var(--ink);line-height:33px;outline-offset:8px;font-size:15px}.sheet-output{position:relative}.editor-mark{position:absolute;left:16px;top:20px;color:var(--accent);font:46px var(--font-display);opacity:.8}.empty{padding:62px 18px 45px;text-align:center;background:var(--surface);height:100%}.empty h2{font:24px var(--font-display);margin-bottom:14px}.empty p{font-size:14px;color:var(--muted);max-width:310px;margin:auto}.output-text{white-space:pre-wrap;font-size:15px;line-height:33px;overflow-wrap:anywhere;padding-left:12px;border-left:2px solid var(--accent);min-height:265px}.sheet-footer{min-height:66px;border-top:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;gap:10px;align-items:center}.link{background:transparent;border:0;padding:5px 0;font-size:12px;color:var(--muted);text-decoration:underline}.primary{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:10px 20px;font-weight:600;font-size:13px}.secondary{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px;color:var(--ink);font-size:13px}.change-note{font-size:12px;color:var(--muted)}.footer{margin-top:26px;display:flex;justify-content:space-between;gap:14px;font-size:12px;color:var(--muted)}.loading{padding:80px 10px;text-align:center;background:var(--surface);color:var(--muted)}.loading span{display:inline-block;width:34px;border-bottom:3px solid var(--accent);animation:mark 1s ease-in-out infinite}.error{background:var(--surface);padding:56px 12px;text-align:center}.error p{color:var(--muted);font-size:14px;margin:14px 0}.output-actions{display:flex;gap:10px;align-items:center}.word-count{font-variant-numeric:tabular-nums}@keyframes mark{50%{width:64px}}@media(max-width:850px){.intro h1{font-size:35px}.edition{display:none}.sheet-body{padding:20px}.sheet-head,.sheet-footer{padding:16px 20px}.output-actions{gap:4px}.sheet-footer{align-items:flex-start;flex-wrap:wrap}}@media(max-width:640px){.header{padding:18px}.header-note{font-size:11px;max-width:160px;text-align:right}main{padding:26px 18px}.intro{margin-bottom:24px}.intro h1{font-size:31px}.tools{align-items:flex-start;flex-direction:column;gap:14px}.tabs button{padding:8px 15px}.desk{grid-template-columns:1fr;gap:24px}.sheet-body{min-height:260px}.sheet textarea{min-height:220px}.empty{padding:45px 12px}.output-text{min-height:220px}.footer{flex-direction:column;align-items:flex-start}.loading{padding:70px 10px}}
.footer summary{cursor:pointer}.footer details p{margin-top:8px;max-width:550px}.mobile-break{display:none}@media(max-width:640px){.mobile-break{display:block}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="header" id="writing-header"><div class="brand"><i>稿</i>稿笺</div><div class="header-note">文字不必更多，<br>只要更接近你想说的。</div></header><main id="writing-workspace" data-state="empty"><section class="intro" id="writing-introduction"><div><h1>好文字，<br class="mobile-break">从一次<em>修改</em>开始。</h1><p>把草稿放在左边，选择一种修改方式。右边保留一份对照稿，决定哪些修改值得留下。</p></div><span class="edition">本地写作演示 / EDITING DESK</span></section><section class="tools" id="writing-controls" aria-label="修改设置"><div class="tabs" role="tablist" aria-label="修改方式"><button role="tab" aria-selected="true" data-tool="polish">润色表达</button><button role="tab" aria-selected="false" data-tool="shorten">精简文字</button><button role="tab" aria-selected="false" data-tool="outline">整理结构</button></div><label class="tone">读者语气<select id="tone"><option value="plain">清楚自然</option><option value="formal">正式汇报</option><option value="friendly">亲切介绍</option></select></label></section><div class="desk"><section class="sheet" id="writing-original"><header class="sheet-head"><h2>原文</h2><small class="word-count" id="original-count">0 字</small></header><div class="sheet-body"><label for="original" hidden>原文草稿</label><textarea id="original" aria-label="原文草稿" maxlength="2500" placeholder="把还不够满意的文字放在这里。&#10;例如：我们想要做一个学习工具…"></textarea></div><footer class="sheet-footer"><button class="link" id="load-sample">放入一段示例</button><button class="primary" id="rewrite">开始修改 ↗</button></footer></section><section class="sheet sheet-output" id="writing-result" aria-live="polite"><header class="sheet-head"><h2>修改稿</h2><small id="result-count">等待修改</small></header><div class="sheet-body" id="output"><div class="empty"><span class="editor-mark">⌁</span><h2>给想法再一次机会</h2><p>完成修改后，你可以比较两份文字，也可以把修改稿放回原文继续打磨。</p></div></div><footer class="sheet-footer"><span class="change-note" id="change-note">原文由你掌握</span><div class="output-actions"><button class="secondary" id="adopt" disabled>采用修改稿</button><button class="secondary" id="download" disabled>导出</button></div></footer></section></div><footer class="footer" id="writing-status"><details><summary>本地修改规则说明</summary><p>精简会删除常见冗余词，润色调整固定表达，结构整理按句子划分段落。原文保留，不调用 AI 服务。</p></details><button class="link" id="writing-fail">演示修改失败</button></footer></main><script>
(()=>{const $=id=>document.getElementById(id),main=$('writing-workspace');let tool='polish',result='',timer;const count=t=>t.replace(/\s/g,'').length;function counts(){$('original-count').textContent=count($('original').value)+' 字'}$('original').oninput=counts;document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));$('change-note').textContent='已选择：'+b.textContent});$('load-sample').onclick=()=>{$('original').value='我们想要做一个帮助学生学习的工具。这个工具可以让学生整理学习计划，并且可以记录每天练习的情况。我觉得这样的话就能够更好地了解自己的学习进度。我们希望先做一个简单版本，然后再根据使用反馈进行改进。';counts();$('original').focus()};function transform(text){const sentences=text.split(/[。！？\n]+/).map(s=>s.trim()).filter(Boolean);if(tool==='outline')return'目标\n'+sentences[0]+'。\n\n主要内容\n'+sentences.slice(1,-1).map(s=>'• '+s+'。').join('\n')+'\n\n下一步\n'+(sentences.length>1?sentences.at(-1)+'。':'为这个目标补充一项可以执行的行动。');let out=text.replace(/我觉得/g,'').replace(/这样的话/g,'').replace(/进行改进/g,'改进').replace(/想要做一个/g,'计划制作一个').replace(/并且可以/g,'并').replace(/就能够/g,'能').replace(/更好地了解/g,'看清').replace(/这个工具可以让学生/g,'学生可以用它');if(tool==='shorten'){out=sentences.map(s=>s.replace(/我觉得|这样的话|更好地|一个|我们希望|然后再/g,'').replace(/就能够/g,'能').replace(/并且可以/g,'并').replace(/进行改进/g,'改进')).join('。')+'。'}if($('tone').value==='formal')out=out.replace(/我们想要/g,'本项目计划').replace(/我们计划/g,'本项目计划').replace(/我们希望/g,'后续计划').replace(/这个工具/g,'该工具');if($('tone').value==='friendly')out='我们想和你一起把事情说清楚。\n\n'+out.replace(/学生/g,'学习者');return out}function run(forced=false){const text=$('original').value.trim();if(!text){main.dataset.state='error';$('output').innerHTML='<div class="error"><h2>原文还没有内容</h2><p>输入一段文字，或点击「放入一段示例」。</p></div>';$('original').focus();return}main.dataset.state='loading';$('rewrite').disabled=true;$('adopt').disabled=true;$('download').disabled=true;$('result-count').textContent='正在修改';$('output').innerHTML='<div class="loading"><span></span><p>正在调整文字与句子节奏…</p></div>';clearTimeout(timer);timer=setTimeout(()=>{$('rewrite').disabled=false;if(forced){main.dataset.state='error';$('result-count').textContent='可以重试';$('output').innerHTML='<div class="error"><h2>本次演示修改未完成</h2><p>原文保持完整，重新修改即可恢复。</p><button class="secondary" id="writing-retry">重新修改</button></div>';$('writing-retry').onclick=()=>run();return}result=transform(text);const n=document.createElement('div');n.className='output-text';n.textContent=result;$('output').replaceChildren(n);main.dataset.state='result';$('result-count').textContent=count(result)+' 字';const difference=count(text)-count(result);$('change-note').textContent=difference>0?'比原文精简 '+difference+' 字':'已完成 '+document.querySelector('[data-tool="'+tool+'"]').textContent;$('adopt').disabled=false;$('download').disabled=false},650)}$('rewrite').onclick=()=>run();$('adopt').onclick=()=>{$('original').value=result;counts();$('change-note').textContent='修改稿已放回原文，可以继续修改';$('original').focus()};$('download').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([result],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='稿笺-修改稿.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('writing-fail').onclick=()=>{if(main.dataset.state==='loading')return;if(!$('original').value.trim())$('load-sample').click();run(true)}})();
</script></body></html>
