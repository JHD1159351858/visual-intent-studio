<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点击与悬停提示 · 原生适配</title><style>
body{margin:0;background:#0b263b;color:#eaf5fc;font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}.vi-preview-meta{max-width:1060px;margin:auto;padding:28px 40px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:#afd0df}.vi-preview-meta strong{font-size:16px;color:#eaf5fc}.vi-preview-stage{min-height:590px;display:grid;place-items:center;padding:50px 40px;position:relative;isolation:isolate}.vi-preview-stage::before{content:'';position:absolute;z-index:-1;width:min(60vw,700px);height:260px;border-radius:48%;background:linear-gradient(120deg,#1f686d,#215679);filter:blur(22px);transform:rotate(-18deg);opacity:.65;pointer-events:none}.vi-preview-footer{max-width:1060px;margin:auto;padding:0 40px 28px;font-size:12px;color:#93b4c6}.vi-preview-source{color:#a8dcd9;overflow-wrap:anywhere}.vi-preview-footer p{margin:5px 0}@media(max-width:600px){.vi-preview-meta{padding:24px 24px 0;align-items:start;flex-direction:column;gap:8px}.vi-preview-stage{padding:32px 24px;min-height:540px}.vi-preview-footer{padding:0 24px 24px}.vi-preview-stage::before{width:75vw;height:200px}}@media(prefers-reduced-motion:reduce){.vi-preview-stage{scroll-behavior:auto}}
.vi-tooltip,.vi-tooltip *{box-sizing:border-box}.vi-tooltip{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-tooltip h2,.vi-tooltip h3,.vi-tooltip p{margin:0}.vi-tooltip h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-tooltip h3{font-size:18px;line-height:1.4}.vi-tooltip p{color:#b8d2e3;font-size:15px}.vi-tooltip button,.vi-tooltip summary,.vi-tooltip input{font:inherit}.vi-tooltip button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-tooltip button:hover{background:#245771}.vi-tooltip button:focus-visible,.vi-tooltip summary:focus-visible,.vi-tooltip input:focus-visible,.vi-tooltip a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-tooltip [hidden]{display:none!important}.vi-tooltip{padding:34px;background:#15374c;border:1px solid #355b70;border-radius:18px}.vi-tooltip>p{margin:16px 0 30px}.vi-tooltip-anchor{position:relative;display:inline-block;padding-top:58px;max-width:100%}.vi-tooltip-bubble{position:absolute;bottom:calc(100% - 48px);left:0;width:min(280px,calc(100vw - 90px));padding:12px 16px;border-radius:10px;background:#d8f8ee;color:#153e46;font-size:13px;box-shadow:0 8px 20px #001b3440;animation:vi-tooltip-enter .16s ease}.vi-tooltip-bubble::after{content:'';position:absolute;bottom:-6px;left:24px;width:12px;height:12px;background:#d8f8ee;transform:rotate(45deg)}@keyframes vi-tooltip-enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.vi-tooltip{padding:24px}.vi-tooltip-anchor{padding-top:80px}.vi-tooltip-bubble{bottom:calc(100% - 70px)}}@media(prefers-reduced-motion:reduce){.vi-tooltip,.vi-tooltip *,.vi-tooltip::before,.vi-tooltip::after,.vi-tooltip *::before,.vi-tooltip *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="vi-preview-meta"><strong>点击与悬停提示</strong><span>原生适配 · 无外部依赖</span></header><main class="vi-preview-stage">
<section class="vi-tooltip"><h2>一条恰好够用的提示</h2><p>用鼠标、键盘或点击查看保存说明。</p><div class="vi-tooltip-anchor"><button type="button" aria-label="查看保存说明" aria-expanded="false">保存说明 <span aria-hidden="true">ⓘ</span></button><span class="vi-tooltip-bubble" role="tooltip" hidden>本地演示：保存功能需要接入业务接口。</span></div></section>
</main><footer class="vi-preview-footer"><p>根据参考方向独立适配，未集成原来源组件。</p><p>来源：<span class="vi-preview-source">https://ui.aceternity.com/components/animated-tooltip</span></p></footer><script>
document.querySelectorAll('.vi-tooltip').forEach((root,index)=>{const anchor=root.querySelector('.vi-tooltip-anchor'),button=root.querySelector('button'),tooltip=root.querySelector('[role="tooltip"]');tooltip.id='vi-tooltip-note-'+index;button.setAttribute('aria-describedby',tooltip.id);let pinned=false;const show=open=>{tooltip.hidden=!open;button.setAttribute('aria-expanded',String(open))};anchor.addEventListener('pointerenter',event=>{if(event.pointerType!=='touch')show(true)});anchor.addEventListener('pointerleave',()=>{if(!pinned&&document.activeElement!==button)show(false)});button.addEventListener('focus',()=>show(true));button.addEventListener('blur',()=>{pinned=false;show(false)});button.addEventListener('click',()=>{pinned=!pinned;show(pinned)});button.addEventListener('keydown',event=>{if(event.key==='Escape'){pinned=false;show(false)}})});
</script></body></html>
