<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可键盘切换的标签页 · 原生适配</title><style>
body{margin:0;background:#0b263b;color:#eaf5fc;font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}.vi-preview-meta{max-width:1060px;margin:auto;padding:28px 40px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:#afd0df}.vi-preview-meta strong{font-size:16px;color:#eaf5fc}.vi-preview-stage{min-height:590px;display:grid;place-items:center;padding:50px 40px;position:relative;isolation:isolate}.vi-preview-stage::before{content:'';position:absolute;z-index:-1;width:min(60vw,700px);height:260px;border-radius:48%;background:linear-gradient(120deg,#1f686d,#215679);filter:blur(22px);transform:rotate(-18deg);opacity:.65;pointer-events:none}.vi-preview-footer{max-width:1060px;margin:auto;padding:0 40px 28px;font-size:12px;color:#93b4c6}.vi-preview-source{color:#a8dcd9;overflow-wrap:anywhere}.vi-preview-footer p{margin:5px 0}@media(max-width:600px){.vi-preview-meta{padding:24px 24px 0;align-items:start;flex-direction:column;gap:8px}.vi-preview-stage{padding:32px 24px;min-height:540px}.vi-preview-footer{padding:0 24px 24px}.vi-preview-stage::before{width:75vw;height:200px}}@media(prefers-reduced-motion:reduce){.vi-preview-stage{scroll-behavior:auto}}
.vi-tabs,.vi-tabs *{box-sizing:border-box}.vi-tabs{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-tabs h2,.vi-tabs h3,.vi-tabs p{margin:0}.vi-tabs h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-tabs h3{font-size:18px;line-height:1.4}.vi-tabs p{color:#b8d2e3;font-size:15px}.vi-tabs button,.vi-tabs summary,.vi-tabs input{font:inherit}.vi-tabs button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-tabs button:hover{background:#245771}.vi-tabs button:focus-visible,.vi-tabs summary:focus-visible,.vi-tabs input:focus-visible,.vi-tabs a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-tabs [hidden]{display:none!important}.vi-tabs{border:1px solid #355b70;border-radius:18px;padding:12px;background:#15374c}.vi-tabs-list{display:flex;gap:6px;padding:6px;background:#0b283a;border-radius:12px}.vi-tabs-list button{flex:1;border:0;background:transparent}.vi-tabs-list button[aria-selected="true"]{background:#2b626d;color:#bbffee}.vi-tabs-panel{padding:36px 24px;min-height:235px}.vi-tabs-panel>span{display:block;color:#65dec6;font-size:12px;margin-bottom:18px}.vi-tabs-panel p{margin-top:16px;max-width:48ch}.vi-tabs-panel:focus-visible{outline:2px solid #65dec6;border-radius:12px}@media(max-width:600px){.vi-tabs-panel{padding:28px 14px}.vi-tabs-list button{padding:8px 6px}}@media(prefers-reduced-motion:reduce){.vi-tabs,.vi-tabs *,.vi-tabs::before,.vi-tabs::after,.vi-tabs *::before,.vi-tabs *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="vi-preview-meta"><strong>可键盘切换的标签页</strong><span>原生适配 · 无外部依赖</span></header><main class="vi-preview-stage">
<section class="vi-tabs"><div class="vi-tabs-list" role="tablist" aria-label="项目资料"><button type="button" role="tab" aria-selected="true" tabindex="0">概览</button><button type="button" role="tab" aria-selected="false" tabindex="-1">素材</button><button type="button" role="tab" aria-selected="false" tabindex="-1">说明</button></div><section class="vi-tabs-panel" role="tabpanel" tabindex="0"><span>项目概览</span><h2>学习空间</h2><p>把课程入口与最近使用的资料放在同一个工作台。</p></section><section class="vi-tabs-panel" role="tabpanel" tabindex="0" hidden><span>素材整理</span><h2>所需素材</h2><p>收集课程封面、说明文字与资料文件，按课程归档。</p></section><section class="vi-tabs-panel" role="tabpanel" tabindex="0" hidden><span>使用说明</span><h2>切换标签即可浏览</h2><p>支持左右方向键，以及Home和End键。此处为静态内容演示。</p></section></section>
</main><footer class="vi-preview-footer"><p>根据参考方向独立适配，未集成原来源组件。</p><p>来源：<span class="vi-preview-source">https://ui.aceternity.com/components/tabs</span></p></footer><script>
document.querySelectorAll('.vi-tabs').forEach((root,instance)=>{const tabs=[...root.querySelectorAll('[role="tab"]')],panels=[...root.querySelectorAll('[role="tabpanel"]')];tabs.forEach((tab,index)=>{tab.id='vi-tabs-'+instance+'-tab-'+index;panels[index].id='vi-tabs-'+instance+'-panel-'+index;tab.setAttribute('aria-controls',panels[index].id);panels[index].setAttribute('aria-labelledby',tab.id)});const select=(index,focus=false)=>{tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===index));tab.tabIndex=i===index?0:-1;panels[i].hidden=i!==index});if(focus)tabs[index].focus()};tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>select(index));tab.addEventListener('keydown',event=>{let next=index;if(event.key==='ArrowRight')next=(index+1)%tabs.length;else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();select(next,true)})})});
</script></body></html>
