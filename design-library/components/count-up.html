<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可重播计数 · 原生适配</title><style>
body{margin:0;background:#0b263b;color:#eaf5fc;font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}.vi-preview-meta{max-width:1060px;margin:auto;padding:28px 40px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:#afd0df}.vi-preview-meta strong{font-size:16px;color:#eaf5fc}.vi-preview-stage{min-height:590px;display:grid;place-items:center;padding:50px 40px;position:relative;isolation:isolate}.vi-preview-stage::before{content:'';position:absolute;z-index:-1;width:min(60vw,700px);height:260px;border-radius:48%;background:linear-gradient(120deg,#1f686d,#215679);filter:blur(22px);transform:rotate(-18deg);opacity:.65;pointer-events:none}.vi-preview-footer{max-width:1060px;margin:auto;padding:0 40px 28px;font-size:12px;color:#93b4c6}.vi-preview-source{color:#a8dcd9;overflow-wrap:anywhere}.vi-preview-footer p{margin:5px 0}@media(max-width:600px){.vi-preview-meta{padding:24px 24px 0;align-items:start;flex-direction:column;gap:8px}.vi-preview-stage{padding:32px 24px;min-height:540px}.vi-preview-footer{padding:0 24px 24px}.vi-preview-stage::before{width:75vw;height:200px}}@media(prefers-reduced-motion:reduce){.vi-preview-stage{scroll-behavior:auto}}
.vi-count-up,.vi-count-up *{box-sizing:border-box}.vi-count-up{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-count-up h2,.vi-count-up h3,.vi-count-up p{margin:0}.vi-count-up h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-count-up h3{font-size:18px;line-height:1.4}.vi-count-up p{color:#b8d2e3;font-size:15px}.vi-count-up button,.vi-count-up summary,.vi-count-up input{font:inherit}.vi-count-up button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-count-up button:hover{background:#245771}.vi-count-up button:focus-visible,.vi-count-up summary:focus-visible,.vi-count-up input:focus-visible,.vi-count-up a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-count-up [hidden]{display:none!important}.vi-count-up{padding:38px;background:#15374c;border:1px solid #355b70;border-radius:18px}.vi-count-up-label{display:block;color:#65dec6;font-size:12px;margin-bottom:22px}.vi-count-up-number{display:flex;align-items:baseline;gap:12px;margin-bottom:22px!important;color:#b8ffea!important}.vi-count-up-value{font-size:clamp(68px,13vw,112px);font-weight:650;line-height:1.1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.vi-count-up-unit{font-size:19px;color:#a2c6d5}.vi-count-up h2{font-size:25px}.vi-count-up h2+p{margin:12px 0 26px}@media(max-width:600px){.vi-count-up{padding:28px}}@media(prefers-reduced-motion:reduce){.vi-count-up,.vi-count-up *,.vi-count-up::before,.vi-count-up::after,.vi-count-up *::before,.vi-count-up *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="vi-preview-meta"><strong>可重播计数</strong><span>原生适配 · 无外部依赖</span></header><main class="vi-preview-stage">
<section class="vi-count-up"><span class="vi-count-up-label">数字动画示例</span><p class="vi-count-up-number" aria-label="示例目标数值128"><span class="vi-count-up-value" aria-hidden="true">128</span><span class="vi-count-up-unit">份</span></p><h2>让变化清楚可见</h2><p>128为演示数值，未连接真实学习数据。</p><button type="button">重播计数</button></section>
</main><footer class="vi-preview-footer"><p>根据参考方向独立适配，未集成原来源组件。</p><p>来源：<span class="vi-preview-source">https://reactbits.dev/text-animations/count-up</span></p></footer><script>
document.querySelectorAll('.vi-count-up').forEach(root=>{const output=root.querySelector('.vi-count-up-value'),button=root.querySelector('button'),preference=matchMedia('(prefers-reduced-motion: reduce)');const target=128,duration=1000;let frame=0;const finish=()=>{cancelAnimationFrame(frame);output.textContent=String(target)};const run=()=>{cancelAnimationFrame(frame);if(preference.matches){finish();return}const start=performance.now();output.textContent='0';const tick=now=>{const t=Math.min((now-start)/duration,1);output.textContent=String(Math.round(target*(1-Math.pow(1-t,3))));if(t<1)frame=requestAnimationFrame(tick)};frame=requestAnimationFrame(tick)};button.addEventListener('click',run);preference.addEventListener('change',event=>{if(event.matches)finish()})});
</script></body></html>
