<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手动切换卡片叠放 · 原生适配</title><style>
body{margin:0;background:#0b263b;color:#eaf5fc;font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}.vi-preview-meta{max-width:1060px;margin:auto;padding:28px 40px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:#afd0df}.vi-preview-meta strong{font-size:16px;color:#eaf5fc}.vi-preview-stage{min-height:590px;display:grid;place-items:center;padding:50px 40px;position:relative;isolation:isolate}.vi-preview-stage::before{content:'';position:absolute;z-index:-1;width:min(60vw,700px);height:260px;border-radius:48%;background:linear-gradient(120deg,#1f686d,#215679);filter:blur(22px);transform:rotate(-18deg);opacity:.65;pointer-events:none}.vi-preview-footer{max-width:1060px;margin:auto;padding:0 40px 28px;font-size:12px;color:#93b4c6}.vi-preview-source{color:#a8dcd9;overflow-wrap:anywhere}.vi-preview-footer p{margin:5px 0}@media(max-width:600px){.vi-preview-meta{padding:24px 24px 0;align-items:start;flex-direction:column;gap:8px}.vi-preview-stage{padding:32px 24px;min-height:540px}.vi-preview-footer{padding:0 24px 24px}.vi-preview-stage::before{width:75vw;height:200px}}@media(prefers-reduced-motion:reduce){.vi-preview-stage{scroll-behavior:auto}}
.vi-card-stack,.vi-card-stack *{box-sizing:border-box}.vi-card-stack{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-card-stack h2,.vi-card-stack h3,.vi-card-stack p{margin:0}.vi-card-stack h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-card-stack h3{font-size:18px;line-height:1.4}.vi-card-stack p{color:#b8d2e3;font-size:15px}.vi-card-stack button,.vi-card-stack summary,.vi-card-stack input{font:inherit}.vi-card-stack button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-card-stack button:hover{background:#245771}.vi-card-stack button:focus-visible,.vi-card-stack summary:focus-visible,.vi-card-stack input:focus-visible,.vi-card-stack a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-card-stack [hidden]{display:none!important}.vi-card-stack{padding:24px 14px;width:min(100%,640px)}.vi-card-stack-deck{position:relative;height:270px;margin-top:28px}.vi-card-stack-deck article{position:absolute;inset:0;padding:36px;border-radius:20px;border:1px solid #5d8496;background:#184357;transform:translateY(calc(var(--depth)*-12px)) scale(calc(1 - var(--depth)*.035));transform-origin:top;z-index:calc(3 - var(--depth));transition:transform .35s ease,opacity .35s ease;opacity:calc(1 - var(--depth)*.2)}.vi-card-stack-deck article>span{display:block;margin-bottom:24px;color:#65dec6;font-size:13px}.vi-card-stack-deck article p{margin-top:18px}.vi-card-stack-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px}.vi-card-stack-controls>span{font-size:13px;color:#b8d2e3}@media(max-width:600px){.vi-card-stack{padding:24px 7px}.vi-card-stack-deck{height:295px}.vi-card-stack-deck article{padding:28px}}@media(prefers-reduced-motion:reduce){.vi-card-stack,.vi-card-stack *,.vi-card-stack::before,.vi-card-stack::after,.vi-card-stack *::before,.vi-card-stack *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="vi-preview-meta"><strong>手动切换卡片叠放</strong><span>原生适配 · 无外部依赖</span></header><main class="vi-preview-stage">
<section class="vi-card-stack" data-index="0"><div class="vi-card-stack-deck"><article style="--depth:0"><span>先找到入口</span><h2>课程有了清楚的位置</h2><p>把常用课程放在最前面。</p></article><article style="--depth:1" aria-hidden="true"><span>再整理资料</span><h2>需要的时候找得到</h2><p>把相关材料放到同一处。</p></article><article style="--depth:2" aria-hidden="true"><span>最后回到练习</span><h2>继续刚才的学习</h2><p>每次只专注一个小步骤。</p></article></div><div class="vi-card-stack-controls"><span aria-live="polite">第1张，共3张</span><button type="button">下一张</button></div></section>
</main><footer class="vi-preview-footer"><p>根据参考方向独立适配，未集成原来源组件。</p><p>来源：<span class="vi-preview-source">https://ui.aceternity.com/components/card-stack</span></p></footer><script>
document.querySelectorAll('.vi-card-stack').forEach(root=>{const cards=[...root.querySelectorAll('article')];let active=0;root.querySelector('button').addEventListener('click',()=>{active=(active+1)%cards.length;root.dataset.index=String(active);cards.forEach((card,index)=>{const depth=(index-active+cards.length)%cards.length;card.style.setProperty('--depth',depth);card.setAttribute('aria-hidden',String(depth!==0))});root.querySelector('[aria-live]').textContent='第'+(active+1)+'张，共'+cards.length+'张'})});
</script></body></html>
