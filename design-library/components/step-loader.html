<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分步进度演示 · 原生适配</title><style>
body{margin:0;background:#0b263b;color:#eaf5fc;font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}.vi-preview-meta{max-width:1060px;margin:auto;padding:28px 40px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:#afd0df}.vi-preview-meta strong{font-size:16px;color:#eaf5fc}.vi-preview-stage{min-height:590px;display:grid;place-items:center;padding:50px 40px;position:relative;isolation:isolate}.vi-preview-stage::before{content:'';position:absolute;z-index:-1;width:min(60vw,700px);height:260px;border-radius:48%;background:linear-gradient(120deg,#1f686d,#215679);filter:blur(22px);transform:rotate(-18deg);opacity:.65;pointer-events:none}.vi-preview-footer{max-width:1060px;margin:auto;padding:0 40px 28px;font-size:12px;color:#93b4c6}.vi-preview-source{color:#a8dcd9;overflow-wrap:anywhere}.vi-preview-footer p{margin:5px 0}@media(max-width:600px){.vi-preview-meta{padding:24px 24px 0;align-items:start;flex-direction:column;gap:8px}.vi-preview-stage{padding:32px 24px;min-height:540px}.vi-preview-footer{padding:0 24px 24px}.vi-preview-stage::before{width:75vw;height:200px}}@media(prefers-reduced-motion:reduce){.vi-preview-stage{scroll-behavior:auto}}
.vi-step-loader,.vi-step-loader *{box-sizing:border-box}.vi-step-loader{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-step-loader h2,.vi-step-loader h3,.vi-step-loader p{margin:0}.vi-step-loader h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-step-loader h3{font-size:18px;line-height:1.4}.vi-step-loader p{color:#b8d2e3;font-size:15px}.vi-step-loader button,.vi-step-loader summary,.vi-step-loader input{font:inherit}.vi-step-loader button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-step-loader button:hover{background:#245771}.vi-step-loader button:focus-visible,.vi-step-loader summary:focus-visible,.vi-step-loader input:focus-visible,.vi-step-loader a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-step-loader [hidden]{display:none!important}.vi-step-loader{padding:32px;background:#15374c;border:1px solid #355b70;border-radius:18px}.vi-step-loader-tag{display:block;color:#65dec6;font-size:12px;margin-bottom:20px}.vi-step-loader>p{margin-top:16px}.vi-step-loader ol{list-style:none;padding:0;display:grid;gap:10px;margin:28px 0}.vi-step-loader li{padding:12px 16px;border:1px solid #355b70;border-radius:10px;color:#a9c5d5;display:flex;align-items:center;gap:12px}.vi-step-loader li::before{content:'○';color:#6f9daf}.vi-step-loader li[data-done="true"]{color:#baffec;background:#1d5059}.vi-step-loader li[data-done="true"]::before{content:'✓';color:#65dec6}.vi-step-loader progress{width:100%;height:9px;border:0;border-radius:8px;accent-color:#65dec6;background:#244b5f;overflow:hidden}.vi-step-loader progress::-webkit-progress-bar{background:#244b5f;border-radius:8px}.vi-step-loader progress::-webkit-progress-value{background:#65dec6;border-radius:8px}.vi-step-loader progress::-moz-progress-bar{background:#65dec6}.vi-step-loader-controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px}.vi-step-loader-controls>span{font-size:13px;color:#b8d2e3}@media(max-width:600px){.vi-step-loader{padding:24px}.vi-step-loader-controls{align-items:start;flex-direction:column}.vi-step-loader-controls button{width:100%}}@media(prefers-reduced-motion:reduce){.vi-step-loader,.vi-step-loader *,.vi-step-loader::before,.vi-step-loader::after,.vi-step-loader *::before,.vi-step-loader *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="vi-preview-meta"><strong>分步进度演示</strong><span>原生适配 · 无外部依赖</span></header><main class="vi-preview-stage">
<section class="vi-step-loader"><span class="vi-step-loader-tag">进度演示</span><h2>让每个步骤都可见</h2><p>下方模拟资料准备过程，不执行上传或分析。</p><ol><li>整理资料</li><li>检查格式</li><li>准备预览</li></ol><progress max="100" value="0" aria-label="演示处理进度">0%</progress><div class="vi-step-loader-controls"><span aria-live="polite">等待运行演示</span><button type="button">运行演示</button></div></section>
</main><footer class="vi-preview-footer"><p>根据参考方向独立适配，未集成原来源组件。</p><p>来源：<span class="vi-preview-source">https://ui.aceternity.com/components/multi-step-loader</span></p></footer><script>
document.querySelectorAll('.vi-step-loader').forEach(root=>{const button=root.querySelector('button'),progress=root.querySelector('progress'),steps=[...root.querySelectorAll('li')],status=root.querySelector('[aria-live]');button.addEventListener('click',async()=>{button.disabled=true;progress.value=0;steps.forEach(step=>delete step.dataset.done);status.textContent='演示处理中';for(let index=0;index<steps.length;index++){await new Promise(resolve=>setTimeout(resolve,matchMedia('(prefers-reduced-motion: reduce)').matches?0:450));steps[index].dataset.done='true';progress.value=Math.round((index+1)/steps.length*100)}status.textContent='演示完成 · 未执行真实业务';button.disabled=false})});
</script></body></html>
