<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>触屏滚动轮播 · 原生适配</title><style>

.vi-carousel,.vi-carousel *{box-sizing:border-box}.vi-carousel{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-carousel h2,.vi-carousel h3,.vi-carousel p{margin:0}.vi-carousel h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-carousel h3{font-size:18px;line-height:1.4}.vi-carousel p{color:#b8d2e3;font-size:15px}.vi-carousel button,.vi-carousel summary,.vi-carousel input{font:inherit}.vi-carousel button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-carousel button:hover{background:#245771}.vi-carousel button:focus-visible,.vi-carousel summary:focus-visible,.vi-carousel input:focus-visible,.vi-carousel a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-carousel [hidden]{display:none!important}.vi-carousel-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.vi-carousel-heading>div{display:flex;gap:8px;flex-shrink:0}.vi-carousel-heading button{padding:7px 12px;min-width:44px}.vi-carousel-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:3px 3px 18px;scrollbar-color:#578ea1 #14374c}.vi-carousel-track article{flex:0 0 66%;background:#15374c;border:1px solid #355b70;border-radius:18px;padding:20px;scroll-snap-align:start;min-width:0}.vi-carousel-art{height:155px;display:grid;place-items:center;border-radius:12px;margin-bottom:22px;font-size:72px;font-weight:300;color:#a6fce4}.vi-carousel-art-one{background:linear-gradient(135deg,#2a686f,#1c4c65)}.vi-carousel-art-two{background:linear-gradient(135deg,#2b5d7e,#204761)}.vi-carousel-art-three{background:linear-gradient(135deg,#386565,#214657)}.vi-carousel-track p{margin-top:12px}.vi-carousel-note{font-size:12px!important;margin-top:10px!important}@media(max-width:600px){.vi-carousel-heading{align-items:start}.vi-carousel-heading h2{font-size:23px}.vi-carousel-track article{flex-basis:86%;padding:18px}.vi-carousel-art{height:145px}}@media(prefers-reduced-motion:reduce){.vi-carousel,.vi-carousel *,.vi-carousel::before,.vi-carousel::after,.vi-carousel *::before,.vi-carousel *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="vi-preview-meta"><strong>触屏滚动轮播</strong><span>原生适配 · 无外部依赖</span></header><main class="vi-preview-stage">
<section class="vi-carousel" aria-label="课程浏览"><div class="vi-carousel-heading"><h2>按自己的节奏浏览</h2><div><button type="button" aria-label="上一项">←</button><button type="button" aria-label="下一项">→</button></div></div><div class="vi-carousel-track" tabindex="0" aria-label="横向课程列表"><article><span class="vi-carousel-art vi-carousel-art-one" aria-hidden="true">波</span><h3>从一个问题开始</h3><p>找到课程的第一个入口。</p></article><article><span class="vi-carousel-art vi-carousel-art-two" aria-hidden="true">线</span><h3>看见知识的联系</h3><p>用清楚的结构整理内容。</p></article><article><span class="vi-carousel-art vi-carousel-art-three" aria-hidden="true">点</span><h3>把想法变成练习</h3><p>用一个小任务完成验证。</p></article></div><p class="vi-carousel-note">静态课程示例 · 可左右滑动</p></section>
</main><footer class="vi-preview-footer"><p>根据参考方向独立适配，未集成原来源组件。</p><p>来源：<span class="vi-preview-source">https://ui.aceternity.com/components/carousel</span></p></footer><script>
document.querySelectorAll('.vi-carousel').forEach(root=>{const track=root.querySelector('.vi-carousel-track');const step=()=>track.querySelector('article').getBoundingClientRect().width+parseFloat(getComputedStyle(track).gap);const move=direction=>track.scrollBy({left:direction*step(),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});root.querySelector('[aria-label="上一项"]').addEventListener('click',()=>move(-1));root.querySelector('[aria-label="下一项"]').addEventListener('click',()=>move(1));track.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();move(event.key==='ArrowRight'?1:-1)}})});
</script></body></html>
