.vi-spotlight-card,.vi-spotlight-card *{box-sizing:border-box}.vi-spotlight-card{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-spotlight-card h2,.vi-spotlight-card h3,.vi-spotlight-card p{margin:0}.vi-spotlight-card h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-spotlight-card h3{font-size:18px;line-height:1.4}.vi-spotlight-card p{color:#b8d2e3;font-size:15px}.vi-spotlight-card button,.vi-spotlight-card summary,.vi-spotlight-card input{font:inherit}.vi-spotlight-card button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-spotlight-card button:hover{background:#245771}.vi-spotlight-card button:focus-visible,.vi-spotlight-card summary:focus-visible,.vi-spotlight-card input:focus-visible,.vi-spotlight-card a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-spotlight-card [hidden]{display:none!important}.vi-spotlight-card{position:relative;isolation:isolate;padding:40px;background:#15374c;border:1px solid #355b70;border-radius:20px;overflow:hidden;--vi-spot-x:50%;--vi-spot-y:50%;--vi-spot-size:340px}.vi-spotlight-card::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(circle var(--vi-spot-size) at var(--vi-spot-x) var(--vi-spot-y),#5df5ca30,transparent 65%);opacity:0;transition:opacity .3s ease;pointer-events:none}.vi-spotlight-card[data-spotlight="true"]::before,.vi-spotlight-card:focus-within::before{opacity:1}.vi-spotlight-card-label{display:block;font-size:12px;color:#65dec6;margin-bottom:28px}.vi-spotlight-card p{max-width:40ch;margin:20px 0 28px}@media(max-width:600px){.vi-spotlight-card{padding:30px 24px;--vi-spot-size:240px}}@media(prefers-reduced-motion:reduce){.vi-spotlight-card::before{background:radial-gradient(circle 260px at 50% 50%,#5df5ca26,transparent 65%)}}@media(prefers-reduced-motion:reduce){.vi-spotlight-card,.vi-spotlight-card *,.vi-spotlight-card::before,.vi-spotlight-card::after,.vi-spotlight-card *::before,.vi-spotlight-card *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

document.querySelectorAll('.vi-spotlight-card').forEach(root=>{const button=root.querySelector('button'),preference=matchMedia('(prefers-reduced-motion: reduce)');let pinned=false;root.addEventListener('pointermove',event=>{if(event.pointerType==='touch'||preference.matches)return;const rect=root.getBoundingClientRect();root.style.setProperty('--vi-spot-x',event.clientX-rect.left+'px');root.style.setProperty('--vi-spot-y',event.clientY-rect.top+'px');root.dataset.spotlight='true'});root.addEventListener('pointerleave',()=>root.dataset.spotlight=String(pinned));button.addEventListener('click',()=>{pinned=!pinned;root.style.setProperty('--vi-spot-x','50%');root.style.setProperty('--vi-spot-y','50%');root.dataset.spotlight=String(pinned);button.setAttribute('aria-pressed',String(pinned))})});
