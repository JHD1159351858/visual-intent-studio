<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点击文字显现 · 原生适配</title><style>
body{margin:0;background:#0b263b;color:#eaf5fc;font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}.vi-preview-meta{max-width:1060px;margin:auto;padding:28px 40px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:#afd0df}.vi-preview-meta strong{font-size:16px;color:#eaf5fc}.vi-preview-stage{min-height:590px;display:grid;place-items:center;padding:50px 40px;position:relative;isolation:isolate}.vi-preview-stage::before{content:'';position:absolute;z-index:-1;width:min(60vw,700px);height:260px;border-radius:48%;background:linear-gradient(120deg,#1f686d,#215679);filter:blur(22px);transform:rotate(-18deg);opacity:.65;pointer-events:none}.vi-preview-footer{max-width:1060px;margin:auto;padding:0 40px 28px;font-size:12px;color:#93b4c6}.vi-preview-source{color:#a8dcd9;overflow-wrap:anywhere}.vi-preview-footer p{margin:5px 0}@media(max-width:600px){.vi-preview-meta{padding:24px 24px 0;align-items:start;flex-direction:column;gap:8px}.vi-preview-stage{padding:32px 24px;min-height:540px}.vi-preview-footer{padding:0 24px 24px}.vi-preview-stage::before{width:75vw;height:200px}}@media(prefers-reduced-motion:reduce){.vi-preview-stage{scroll-behavior:auto}}
.vi-text-reveal,.vi-text-reveal *{box-sizing:border-box}.vi-text-reveal{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-text-reveal h2,.vi-text-reveal h3,.vi-text-reveal p{margin:0}.vi-text-reveal h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-text-reveal h3{font-size:18px;line-height:1.4}.vi-text-reveal p{color:#b8d2e3;font-size:15px}.vi-text-reveal button,.vi-text-reveal summary,.vi-text-reveal input{font:inherit}.vi-text-reveal button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-text-reveal button:hover{background:#245771}.vi-text-reveal button:focus-visible,.vi-text-reveal summary:focus-visible,.vi-text-reveal input:focus-visible,.vi-text-reveal a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-text-reveal [hidden]{display:none!important}.vi-text-reveal{padding:36px;background:#15374c;border:1px solid #355b70;border-radius:18px}.vi-text-reveal-label{display:block;color:#65dec6;font-size:12px;margin-bottom:24px}.vi-text-reveal-stage{position:relative;padding:30px 0;overflow:hidden}.vi-text-reveal-stage p{font-size:clamp(22px,4vw,32px);font-weight:650;color:#eaf5fc;line-height:1.6}.vi-text-reveal-message{position:absolute;inset:30px 0 auto;color:#b8ffe9!important;clip-path:inset(0 100% 0 0);transition:clip-path .65s ease}.vi-text-reveal-base{transition:opacity .5s ease}.vi-text-reveal[data-revealed="true"] .vi-text-reveal-message{clip-path:inset(0)}.vi-text-reveal[data-revealed="true"] .vi-text-reveal-base{opacity:0}.vi-text-reveal-note{margin-bottom:24px!important;font-size:13px!important}@media(max-width:600px){.vi-text-reveal{padding:28px 22px}.vi-text-reveal-stage p{font-size:23px}}@media(prefers-reduced-motion:reduce){.vi-text-reveal,.vi-text-reveal *,.vi-text-reveal::before,.vi-text-reveal::after,.vi-text-reveal *::before,.vi-text-reveal *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="vi-preview-meta"><strong>点击文字显现</strong><span>原生适配 · 无外部依赖</span></header><main class="vi-preview-stage">
<section class="vi-text-reveal" data-revealed="false"><span class="vi-text-reveal-label">一句话，逐渐清楚</span><div class="vi-text-reveal-stage"><p class="vi-text-reveal-base" aria-hidden="true">把想法留在纸上</p><p class="vi-text-reveal-message">把想法变成下一步</p></div><p class="vi-text-reveal-note">点击后查看完整文字。此处只演示文字显现。</p><button type="button" aria-expanded="false">显现文字</button></section>
</main><footer class="vi-preview-footer"><p>根据参考方向独立适配，未集成原来源组件。</p><p>来源：<span class="vi-preview-source">https://ui.aceternity.com/components/text-reveal-card</span></p></footer><script>
document.querySelectorAll('.vi-text-reveal').forEach(root=>{const button=root.querySelector('button'),message=root.querySelector('.vi-text-reveal-message');message.setAttribute('aria-hidden','true');button.addEventListener('click',()=>{const revealed=root.dataset.revealed!=='true';root.dataset.revealed=String(revealed);button.setAttribute('aria-expanded',String(revealed));button.textContent=revealed?'收起文字':'显现文字';message.setAttribute('aria-hidden',String(!revealed))})});
</script></body></html>
