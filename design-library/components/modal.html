.vi-modal,.vi-modal *{box-sizing:border-box}.vi-modal{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-modal h2,.vi-modal h3,.vi-modal p{margin:0}.vi-modal h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-modal h3{font-size:18px;line-height:1.4}.vi-modal p{color:#b8d2e3;font-size:15px}.vi-modal button,.vi-modal summary,.vi-modal input{font:inherit}.vi-modal button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-modal button:hover{background:#245771}.vi-modal button:focus-visible,.vi-modal summary:focus-visible,.vi-modal input:focus-visible,.vi-modal a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-modal [hidden]{display:none!important}.vi-modal{padding:34px;border:1px solid #355b70;border-radius:18px;background:#15374c}.vi-modal-label{display:block;color:#65dec6;font-size:12px;margin-bottom:22px}.vi-modal>p{margin:16px 0 24px}.vi-modal-dialog{width:min(560px,calc(100vw - 36px));max-height:calc(100dvh - 40px);overflow:auto;border:1px solid #5b8b9a;border-radius:20px;padding:30px;color:#eaf5fc;background:#173b51;box-shadow:0 24px 80px #0008;animation:vi-modal-enter .18s ease-out}.vi-modal-dialog::backdrop{background:#061b2bd9;backdrop-filter:blur(5px)}.vi-modal-heading{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:20px}.vi-modal-heading button{padding:3px 12px;font-size:28px;flex-shrink:0}.vi-modal-dialog p{margin-bottom:18px}.vi-modal-hint{font-size:12px!important;color:#65dec6!important}@keyframes vi-modal-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.vi-modal{padding:24px}.vi-modal-dialog{padding:22px}.vi-modal-dialog h2{font-size:22px}}@media(prefers-reduced-motion:reduce){.vi-modal,.vi-modal *,.vi-modal::before,.vi-modal::after,.vi-modal *::before,.vi-modal *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="vi-preview-meta"><strong>原生说明弹窗</strong><span>原生适配 · 无外部依赖</span></header><main class="vi-preview-stage">
<section class="vi-modal"><span class="vi-modal-label">项目说明</span><h2>把细节留在需要的时候</h2><p>点击按钮查看说明；弹窗支持键盘退出。</p><button type="button" data-open>查看项目说明</button><dialog class="vi-modal-dialog" aria-label="项目说明"><div class="vi-modal-heading"><h2>学习空间说明</h2><button type="button" data-close aria-label="关闭说明">×</button></div><p>这个示例展示原生弹窗的交互。正文可以替换为项目介绍或操作提示。</p><p class="vi-modal-hint">本地演示 · 未接入保存或提交功能</p><button type="button" data-close>我知道了</button></dialog></section>
</main><footer class="vi-preview-footer"><p>根据参考方向独立适配，未集成原来源组件。</p><p>来源：<span class="vi-preview-source">https://ui.aceternity.com/components/animated-modal</span></p></footer><script>
document.querySelectorAll('.vi-modal').forEach(root=>{const dialog=root.querySelector('dialog'),open=root.querySelector('[data-open]');open.addEventListener('click',()=>dialog.showModal());root.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>dialog.close()));dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close()}});dialog.addEventListener('close',()=>open.focus())});
</script></body></html>
