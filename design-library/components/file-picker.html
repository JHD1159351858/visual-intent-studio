<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地文件选择 · 原生适配</title><style>
body{margin:0;background:#0b263b;color:#eaf5fc;font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}.vi-preview-meta{max-width:1060px;margin:auto;padding:28px 40px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:#afd0df}.vi-preview-meta strong{font-size:16px;color:#eaf5fc}.vi-preview-stage{min-height:590px;display:grid;place-items:center;padding:50px 40px;position:relative;isolation:isolate}.vi-preview-stage::before{content:'';position:absolute;z-index:-1;width:min(60vw,700px);height:260px;border-radius:48%;background:linear-gradient(120deg,#1f686d,#215679);filter:blur(22px);transform:rotate(-18deg);opacity:.65;pointer-events:none}.vi-preview-footer{max-width:1060px;margin:auto;padding:0 40px 28px;font-size:12px;color:#93b4c6}.vi-preview-source{color:#a8dcd9;overflow-wrap:anywhere}.vi-preview-footer p{margin:5px 0}@media(max-width:600px){.vi-preview-meta{padding:24px 24px 0;align-items:start;flex-direction:column;gap:8px}.vi-preview-stage{padding:32px 24px;min-height:540px}.vi-preview-footer{padding:0 24px 24px}.vi-preview-stage::before{width:75vw;height:200px}}@media(prefers-reduced-motion:reduce){.vi-preview-stage{scroll-behavior:auto}}
.vi-file-picker,.vi-file-picker *{box-sizing:border-box}.vi-file-picker{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf5fc;line-height:1.6;min-width:0;width:min(100%,720px)}.vi-file-picker h2,.vi-file-picker h3,.vi-file-picker p{margin:0}.vi-file-picker h2{font-size:clamp(22px,4vw,30px);line-height:1.3;letter-spacing:-.03em}.vi-file-picker h3{font-size:18px;line-height:1.4}.vi-file-picker p{color:#b8d2e3;font-size:15px}.vi-file-picker button,.vi-file-picker summary,.vi-file-picker input{font:inherit}.vi-file-picker button{cursor:pointer;border:1px solid #426981;color:#eaf5fc;background:#193e55;border-radius:10px;padding:10px 16px;min-height:44px}.vi-file-picker button:hover{background:#245771}.vi-file-picker button:focus-visible,.vi-file-picker summary:focus-visible,.vi-file-picker input:focus-visible,.vi-file-picker a:focus-visible{outline:3px solid #65dec6;outline-offset:4px}.vi-file-picker [hidden]{display:none!important}.vi-file-picker{padding:32px;border-radius:18px;border:1px solid #355b70;background:#15374c}.vi-file-picker>p{margin-top:14px}.vi-file-picker-zone{position:relative;display:grid;place-items:center;text-align:center;gap:12px;margin-top:28px;padding:32px 18px;border:1px dashed #6593a5;border-radius:14px;background:#123a4f;cursor:pointer;min-height:220px}.vi-file-picker-zone>span{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:#2b6069;color:#abffec;font-size:32px}.vi-file-picker-zone strong{font-size:16px}.vi-file-picker-zone small{color:#a9c5d5;font-size:12px}.vi-file-picker-zone input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.vi-file-picker-zone:focus-within{outline:3px solid #65dec6;outline-offset:4px}.vi-file-picker-zone[data-drag="true"]{background:#28606a;border-color:#abffec}.vi-file-picker-status{overflow-wrap:anywhere;font-size:13px!important}@media(max-width:600px){.vi-file-picker{padding:24px}.vi-file-picker-zone{padding:26px 14px;min-height:210px}}@media(prefers-reduced-motion:reduce){.vi-file-picker,.vi-file-picker *,.vi-file-picker::before,.vi-file-picker::after,.vi-file-picker *::before,.vi-file-picker *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="vi-preview-meta"><strong>本地文件选择</strong><span>原生适配 · 无外部依赖</span></header><main class="vi-preview-stage">
<section class="vi-file-picker"><h2>先选好一份资料</h2><p>只读取文件名与大小，不上传文件。</p><label class="vi-file-picker-zone"><span aria-hidden="true">↑</span><strong>选择文件，或拖到这里</strong><small>本地演示 · 不发送到服务器</small><input type="file" aria-label="选择本地文件"></label><p class="vi-file-picker-status" aria-live="polite">尚未选择文件</p></section>
</main><footer class="vi-preview-footer"><p>根据参考方向独立适配，未集成原来源组件。</p><p>来源：<span class="vi-preview-source">https://ui.aceternity.com/components/file-upload</span></p></footer><script>
document.querySelectorAll('.vi-file-picker').forEach(root=>{const input=root.querySelector('input'),zone=root.querySelector('label'),status=root.querySelector('[aria-live]');const show=file=>{status.textContent=file?'已选择：'+file.name+' · '+(file.size<1024?file.size+' B':(file.size/1024).toFixed(1)+' KB')+' · 未上传':'尚未选择文件'};input.addEventListener('change',()=>show(input.files[0]));zone.addEventListener('dragover',event=>{event.preventDefault();zone.dataset.drag='true'});zone.addEventListener('dragleave',()=>delete zone.dataset.drag);zone.addEventListener('drop',event=>{event.preventDefault();delete zone.dataset.drag;show(event.dataTransfer.files[0])})});
</script></body></html>
